<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Wolf Society · Admin Access</title>
  
  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            vantablack: '#020203',
            madpink: '#ef4444',
            wolf: { dark: '#020204', slate: '#08080f', red: '#ef4444' }
          }
        }
      }
    }
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020203;
      background-image: radial-gradient(circle at 20% 30%, rgba(239, 68, 68, 0.06) 0%, transparent 50%), 
                        radial-gradient(circle at 80% 70%, rgba(239, 68, 68, 0.04) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .glass-card {
      background: rgba(12, 18, 34, 0.8);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.04);
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(239, 68, 68, 0.04);
    }
    .luxury-title-gradient {
      background: linear-gradient(90deg, #fff 0%, #ffccd3 30%, #ef4444 65%, #ffccd8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 8s ease-in-out infinite alternate;
      background-clip: text;
    }
    @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
    .input-field {
      transition: all 0.3s ease;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .input-field:focus {
      border-color: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.08);
      outline: none;
      background: rgba(0,0,0,0.4);
    }
    .btn-primary {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #ffffff, #e5e7eb);
      color: #020203;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.25);
      transform: scale(1.01);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      transition: all 0.3s ease;
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(239, 68, 68, 0.3);
      color: white;
    }
    .auth-tab {
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }
    .auth-tab.active {
      color: white;
    }
    .auth-tab.active::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      right: 0;
      height: 2px;
      background: #ef4444;
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
    }
    .auth-tab:not(.active) {
      color: #6b7280;
    }
    .auth-tab:not(.active):hover {
      color: #9ca3af;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #020203; }
    ::-webkit-scrollbar-thumb { background: #ef4444; border-radius: 10px; }
  </style>
</head>
<body>
  
  <div class="w-full max-w-md mx-auto relative">
    <!-- Back to Main Site -->
    <a href="/" class="absolute -top-12 left-0 flex items-center gap-2 text-[10px] font-mono text-white/30 hover:text-madpink transition-colors cursor-pointer">
      <i data-lucide="arrow-left" class="w-3 h-3"></i>
      <span>Back to Kingdom</span>
    </a>

    <!-- Main Card -->
    <div class="glass-card rounded-3xl p-6 md:p-8 w-full relative overflow-hidden">
      
      <!-- Ambient Glow -->
      <div class="absolute -top-20 -right-20 w-40 h-40 bg-madpink rounded-full blur-[100px] opacity-10"></div>
      <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-madpink rounded-full blur-[100px] opacity-10"></div>

      <!-- Branding -->
      <div class="flex flex-col items-center text-center mb-8">
        <div class="relative group">
          <svg viewBox="0 0 100 100" class="w-12 h-12 text-madpink filter drop-shadow-[0_0_15px_rgba(224,26,132,0.3)]" fill="none" stroke="currentColor" stroke-width="3">
            <polygon points="50,15 35,45 50,55" />
            <polygon points="50,15 65,45 50,55" />
            <polygon points="35,45 15,25 25,60 50,85" />
            <polygon points="65,45 85,25 75,60 50,85" />
            <circle cx="42" cy="48" r="2" fill="#ef4444" />
            <circle cx="58" cy="48" r="2" fill="#ef4444" />
          </svg>
        </div>
        <h1 class="text-2xl font-outfit font-black uppercase tracking-tight mt-2">
          WOLF <span class="luxury-title-gradient">SOCIETY</span>
        </h1>
        <p class="text-[8px] font-mono tracking-[0.4em] uppercase text-white/30 mt-1">Command Access Terminal</p>
      </div>

      <!-- Tabs -->
      <div class="flex justify-center gap-8 mb-8 border-b border-white/[0.04] pb-2">
        <span id="tab-login" class="auth-tab active text-xs font-mono font-bold uppercase tracking-wider" onclick="switchAuthTab('login')">Sign In</span>
        <span id="tab-register" class="auth-tab text-xs font-mono font-bold uppercase tracking-wider" onclick="switchAuthTab('register')">Register</span>
      </div>

      <!-- ================= LOGIN FORM ================= -->
      <div id="login-form" class="space-y-4">
        <div class="relative">
          <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30"></i>
          <input id="login-email" type="email" placeholder="Dispatcher Email" class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-white text-xs font-mono placeholder-white/20" />
        </div>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30"></i>
          <input id="login-password" type="password" placeholder="Tactical Password" class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-white text-xs font-mono placeholder-white/20" />
        </div>
        <button onclick="handleAdminLogin()" class="btn-primary w-full py-3.5 rounded-xl font-mono font-black text-xs uppercase tracking-widest text-white transition-all">
          <i data-lucide="log-in" class="w-4 h-4 inline-block mr-2"></i> Access Command Deck
        </button>
        <p id="login-error" class="text-[10px] font-mono text-red-400 text-center hidden">Invalid credentials. Try again.</p>
      </div>

      <!-- ================= REGISTER FORM ================= -->
      <div id="register-form" class="space-y-4 hidden">
        <div class="relative">
          <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30"></i>
          <input id="reg-name" type="text" placeholder="Agent Callsign" class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-white text-xs font-mono placeholder-white/20" />
        </div>
        <div class="relative">
          <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30"></i>
          <input id="reg-email" type="email" placeholder="Dispatcher Email" class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-white text-xs font-mono placeholder-white/20" />
        </div>
        <div class="relative">
          <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30"></i>
          <input id="reg-password" type="password" placeholder="Tactical Password (min 8)" class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-white text-xs font-mono placeholder-white/20" />
        </div>
        <div class="relative">
          <i data-lucide="shield-check" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-white/30"></i>
          <input id="reg-confirm" type="password" placeholder="Verify Password" class="input-field w-full pl-11 pr-4 py-3 rounded-xl text-white text-xs font-mono placeholder-white/20" />
        </div>
        <button onclick="handleAdminRegister()" class="btn-primary w-full py-3.5 rounded-xl font-mono font-black text-xs uppercase tracking-widest text-white transition-all">
          <i data-lucide="user-plus" class="w-4 h-4 inline-block mr-2"></i> Establish Credentials
        </button>
        <p id="register-success" class="text-[10px] font-mono text-emerald-400 text-center hidden">Account created! Please sign in.</p>
        <p id="register-error" class="text-[10px] font-mono text-red-400 text-center hidden"></p>
      </div>

      <!-- Footer -->
      <div class="mt-8 pt-6 border-t border-white/[0.04] text-center">
        <span class="text-[8px] font-mono text-white/20 uppercase tracking-widest">Secured by Wolf Society Shield</span>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // AUTH LOGIC
    // ============================================================
    function getAdmins() {
      try { return JSON.parse(localStorage.getItem('wolf_admins')) || []; } catch { return []; }
    }
    function saveAdmins(admins) {
      localStorage.setItem('wolf_admins', JSON.stringify(admins));
    }

    function switchAuthTab(tab) {
      const loginTab = document.getElementById('tab-login');
      const regTab = document.getElementById('tab-register');
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      
      if (tab === 'login') {
        loginTab.classList.add('active');
        regTab.classList.remove('active');
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        document.getElementById('login-error').classList.add('hidden');
      } else {
        regTab.classList.add('active');
        loginTab.classList.remove('active');
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        document.getElementById('register-error').classList.add('hidden');
        document.getElementById('register-success').classList.add('hidden');
      }
      lucide.createIcons();
    }

    function handleAdminLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const errorEl = document.getElementById('login-error');
      
      if (!email || !password) {
        errorEl.innerText = 'All fields are required.';
        errorEl.classList.remove('hidden');
        return;
      }

      const admins = getAdmins();
      const user = admins.find(u => u.email === email && u.password === password);
      
      if (user) {
        // Save session
        localStorage.setItem('wolf_admin_session', JSON.stringify({ email: user.email, name: user.name, timestamp: Date.now() }));
        errorEl.classList.add('hidden');
        // Redirect to admin dashboard
        window.location.href = '/admin.html';
      } else {
        errorEl.innerText = 'Invalid credentials. Access denied.';
        errorEl.classList.remove('hidden');
      }
    }

    function handleAdminRegister() {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;
      
      const errorEl = document.getElementById('register-error');
      const successEl = document.getElementById('register-success');
      
      errorEl.classList.add('hidden');
      successEl.classList.add('hidden');

      if (!name || !email || !password || !confirm) {
        errorEl.innerText = 'All fields are mandatory.';
        errorEl.classList.remove('hidden');
        return;
      }
      
      if (password.length < 8) {
        errorEl.innerText = 'Password must be at least 8 characters.';
        errorEl.classList.remove('hidden');
        return;
      }

      if (password !== confirm) {
        errorEl.innerText = 'Passwords do not match.';
        errorEl.classList.remove('hidden');
        return;
      }

      const admins = getAdmins();
      if (admins.find(u => u.email === email)) {
        errorEl.innerText = 'Email already registered.';
        errorEl.classList.remove('hidden');
        return;
      }

      // Save new admin
      admins.push({ name, email, password });
      saveAdmins(admins);
      
      successEl.innerText = 'Account created successfully! Please sign in.';
      successEl.classList.remove('hidden');
      
      // Clear fields
      document.getElementById('reg-name').value = '';
      document.getElementById('reg-email').value = '';
      document.getElementById('reg-password').value = '';
      document.getElementById('reg-confirm').value = '';
      
      // Auto switch to login after 1.5s
      setTimeout(() => {
        switchAuthTab('login');
        document.getElementById('login-email').value = email;
      }, 1500);
    }

    // Check if already logged in, redirect to admin
    (function checkSession() {
      const session = localStorage.getItem('wolf_admin_session');
      if (session && window.location.pathname.includes('admin-login')) {
        // If we are on login page but already logged in, go to admin
        window.location.href = '/admin.html';
      }
    })();

    // Init Lucide
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
