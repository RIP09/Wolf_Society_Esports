<!DOCTYPE html>
<html lang="en">
<head>
    <!-- same head as about.html -->
    <title>Wolf Society · Team</title>
</head>
<body>
    <div class="ambient-bg"></div>
    <!-- same navbar as about.html, with active link to team.html -->
    <nav class="navbar" id="mainNav">...</nav>

    <section class="section" style="padding-top:8rem;">
        <div class="container">
            <div class="badge-glow">👥 Our Pack</div>
            <h1 class="section-title" id="pageTitle">Meet Divine Wolf</h1>
            <p class="section-sub" id="pageSub">Five players. One mission. Total domination.</p>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:2rem; margin-top:2rem;" id="rosterGrid">
                <!-- Player cards -->
                <div class="glass player-card" style="padding:1.5rem; border-radius:var(--radius-lg); text-align:center; cursor:pointer;" data-modal-open="playerModal" data-player="Alpha">
                    <div style="font-size:4rem;">🦊</div>
                    <h3>Alpha</h3>
                    <p style="color:var(--text-secondary);">Captain · Top Laner</p>
                    <span class="badge-glow" style="font-size:0.6rem;">★★★★★</span>
                </div>
                <div class="glass player-card" style="padding:1.5rem; border-radius:var(--radius-lg); text-align:center; cursor:pointer;" data-modal-open="playerModal" data-player="Beta">
                    <div style="font-size:4rem;">🐉</div>
                    <h3>Beta</h3>
                    <p style="color:var(--text-secondary);">Jungler</p>
                    <span class="badge-glow" style="font-size:0.6rem;">★★★★☆</span>
                </div>
                <div class="glass player-card" style="padding:1.5rem; border-radius:var(--radius-lg); text-align:center; cursor:pointer;" data-modal-open="playerModal" data-player="Gamma">
                    <div style="font-size:4rem;">🧙</div>
                    <h3>Gamma</h3>
                    <p style="color:var(--text-secondary);">Mid Laner</p>
                    <span class="badge-glow" style="font-size:0.6rem;">★★★★★</span>
                </div>
                <div class="glass player-card" style="padding:1.5rem; border-radius:var(--radius-lg); text-align:center; cursor:pointer;" data-modal-open="playerModal" data-player="Delta">
                    <div style="font-size:4rem;">🏹</div>
                    <h3>Delta</h3>
                    <p style="color:var(--text-secondary);">ADC</p>
                    <span class="badge-glow" style="font-size:0.6rem;">★★★★☆</span>
                </div>
                <div class="glass player-card" style="padding:1.5rem; border-radius:var(--radius-lg); text-align:center; cursor:pointer;" data-modal-open="playerModal" data-player="Epsilon">
                    <div style="font-size:4rem;">🛡️</div>
                    <h3>Epsilon</h3>
                    <p style="color:var(--text-secondary);">Support</p>
                    <span class="badge-glow" style="font-size:0.6rem;">★★★★★</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Modal -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal">
            <button class="close-btn">&times;</button>
            <h2 id="playerName">Player Name</h2>
            <p id="playerRole" style="color:var(--text-secondary);">Role</p>
            <p style="margin-top:1rem;">Detailed stats and bio will appear here.</p>
            <button class="btn btn-primary btn-ripple" style="margin-top:1.5rem;">View Full Profile</button>
        </div>
    </div>

    <!-- same footer -->
    <footer class="footer">...</footer>

    <script src="frontend/js/supabase-client.js" type="module"></script>
    <script src="frontend/js/auth.js" type="module"></script>
    <script src="frontend/js/main.js" type="module"></script>
    <script>
        gsap.registerPlugin(ScrollTrigger);
        gsap.from('#pageTitle', { opacity: 0, y: 40, duration: 0.8, delay: 0.2 });
        gsap.from('#pageSub', { opacity: 0, y: 30, duration: 0.8, delay: 0.4 });
        document.querySelectorAll('.player-card').forEach((card, i) => {
            gsap.from(card, { scrollTrigger: { trigger: card, start: 'top 88%' }, opacity: 0, y: 30, duration: 0.6, delay: i * 0.08, ease: 'back.out(1.7)' });
        });
        // Modal logic
        document.querySelectorAll('[data-modal-open="playerModal"]').forEach(el => {
            el.addEventListener('click', function() {
                document.getElementById('playerName').textContent = this.dataset.player;
                document.getElementById('playerRole').textContent = this.querySelector('p')?.textContent || 'Player';
                document.getElementById('playerModal').classList.add('active');
            });
        });
    </script>
</body>
</html>
