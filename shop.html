<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop · Wolf Society</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- Same header -->
  <header class="fixed top-0 left-0 w-full bg-[#0a0a0a]/90 backdrop-blur-md border-b border-[#2a2a2a] z-50 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <a href="/" class="text-2xl font-bold gradient-text">Wolf Society</a>
      <span class="text-xs text-gray-500 hidden sm:inline">Esports</span>
    </div>
    <nav class="hidden md:flex space-x-6 text-sm font-medium nav-links"></nav>
    <div class="flex items-center space-x-3">
      <button id="mobile-menu-btn" class="md:hidden text-gray-300 text-xl"><i class="fas fa-bars"></i></button>
    </div>
  </header>
  <div id="mobile-menu" class="md:hidden fixed top-16 left-0 w-full bg-[#0a0a0a]/95 backdrop-blur-md border-b border-[#2a2a2a] p-4 flex-col space-y-3 text-sm font-medium z-40 hidden"></div>

  <main class="pt-16">
    <section class="max-w-7xl mx-auto px-4 section-pad">
      <h1 class="text-4xl font-bold mb-8">Merchandise</h1>
      <div id="shop-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <footer class="bg-[#1a1a1a] border-t border-[#2a2a2a] py-8 px-4 text-center text-gray-400 text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center">
      <div class="flex items-center space-x-4">
        <span class="text-xl font-bold gradient-text">Wolf Society</span>
        <span>© 2026 All rights reserved.</span>
      </div>
      <div class="flex space-x-4 mt-4 md:mt-0">
        <a href="./legal.html" class="hover:text-white transition">Privacy</a>
        <a href="./legal.html" class="hover:text-white transition">Terms</a>
        <a href="./faq.html" class="hover:text-white transition">FAQ</a>
      </div>
    </div>
  </footer>

  <script type="importmap">{
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
    }
  }</script>
  <script type="module">
    import { updateNav, getMerchandise } from './js/main.js';
    import AOS from 'https://unpkg.com/aos@2.3.1/dist/aos.esm.js';
    AOS.init({ duration: 800, once: true });
    await updateNav();
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    const items = await getMerchandise();
    const container = document.getElementById('shop-grid');
    container.innerHTML = items.map(item => `
      <div class="bg-[#1a1a1a] p-4 rounded-xl border border-[#2a2a2a]">
        <img src="${item.image_url || 'https://via.placeholder.com/300x200'}" alt="${item.name}" class="w-full h-48 object-cover rounded-lg mb-3" />
        <h3 class="text-lg font-bold">${item.name}</h3>
        <p class="text-gray-400">₹${item.price}</p>
        <button class="mt-2 px-4 py-2 bg-[#00f0ff] text-black rounded hover:opacity-80 transition">Add to Cart</button>
      </div>
    `).join('');
  </script>
</body>
</html>
