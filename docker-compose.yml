version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: wolf_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wolfpass
      POSTGRES_DB: wolf_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: wolf_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: wolfpass
      DB_NAME: wolf_db
      DB_PORT: 5432
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  postgres_data:
