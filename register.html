<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wolf Society · Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Raleway:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
</head>
<body>

    <nav class="navbar-wolf">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
            <a href="index.html" class="brand">🐺 WOLF<span>SOCIETY</span></a>
            <button class="nav-toggle"><i class="fas fa-bars"></i></button>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="roster.html">Roster</a>
                <a href="schedule.html">Schedule</a>
                <a href="bracket.html">Bracket</a>
                <a href="news.html">News</a>
                <a href="sponsors.html">Sponsors</a>
                <a href="merch.html">Merch</a>
                <a href="community.html">Community</a>
                <a href="about.html">About</a>
                <a href="tryouts.html">Tryouts</a>
                <div class="nav-right">
                    <a href="login.html" class="btn-neon btn-neon-sm">Login</a>
                    <a href="dashboard.html" class="btn-neon btn-neon-sm btn-neon-secondary">Admin</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="main-wrapper">
        <div class="container auth-container">
            <div class="auth-box glass-card p-5">
                <h2 class="section-title text-center" style="font-size:2rem;">📝 <span class="highlight">Register</span></h2>
                <p class="text-center text-muted small">Join the Wolf Society pack.</p>
                <form id="registerForm" class="mt-4">
                    <div id="registerError" class="alert alert-danger d-none"></div>
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" id="regFullName" class="form-control" placeholder="Your Name" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select id="regRole" class="form-control">
                            <option value="player">Player</option>
                            <option value="coach">Coach</option>
                            <option value="manager">Manager</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-neon w-100">Register</button>
                </form>
                <div class="text-center mt-3">
                    <span class="text-muted small">Already have an account?</span>
                    <a href="login.html" class="small">Login</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-wolf" style="margin-top:0;">
        <div class="container">
            <div class="copyright">&copy; 2026 Wolf Society Esports.</div>
        </div>
    </footer>

    <script src="main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const role = document.getElementById('regRole').value;
            const errorEl = document.getElementById('registerError');

            try {
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: { data: { full_name: fullName, role: role } }
                });
                if (error) throw error;
                if (data.user) {
                    await supabase.from('profiles').insert([{
                        id: data.user.id,
                        full_name: fullName,
                        role: role,
                        email: email
                    }]);
                }
                alert('Registration successful! Please check your email to confirm.');
                window.location.href = 'login.html';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
