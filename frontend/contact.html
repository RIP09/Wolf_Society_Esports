<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact · Wolf Society</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- Same header -->
  <header class="fixed top-0 left-0 w-full bg-[#0a0a0a]/90 backdrop-blur-md border-b border-[#2a2a2a] z-50 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <a href="/" class="text-2xl font-bold gradient-text">Wolf Society</a>
      <span class="text-xs text-gray-500 hidden sm:inline">Esports</span>
    </div>
    <nav class="hidden md:flex space-x-6 text-sm font-medium nav-links"></nav>
    <div class="flex items-center space-x-3">
      <button id="mobile-menu-btn" class="md:hidden text-gray-300 text-xl"><i class="fas fa-bars"></i></button>
    </div>
  </header>
  <div id="mobile-menu" class="md:hidden fixed top-16 left-0 w-full bg-[#0a0a0a]/95 backdrop-blur-md border-b border-[#2a2a2a] p-4 flex-col space-y-3 text-sm font-medium z-40 hidden"></div>

  <main class="pt-16">
    <section class="max-w-3xl mx-auto px-4 section-pad">
      <h1 class="text-4xl font-bold mb-6">Contact Us</h1>
      <form id="contact-form" class="space-y-4">
        <input type="text" name="name" placeholder="Your Name" required class="w-full px-4 py-3 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-white focus:ring-2 focus:ring-[#00f0ff] outline-none" />
        <input type="email" name="email" placeholder="Email" required class="w-full px-4 py-3 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-white focus:ring-2 focus:ring-[#00f0ff] outline-none" />
        <input type="text" name="subject" placeholder="Subject" class="w-full px-4 py-3 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-white focus:ring-2 focus:ring-[#00f0ff] outline-none" />
        <textarea name="message" placeholder="Message" rows="5" required class="w-full px-4 py-3 bg-[#1a1a1a] border border-[#2a2a2a] rounded-lg text-white focus:ring-2 focus:ring-[#00f0ff] outline-none"></textarea>
        <button type="submit" class="px-6 py-3 bg-gradient-to-r from-[#00f0ff] to-[#ff2d55] text-black font-bold rounded-lg hover:opacity-90 transition">Send Message</button>
      </form>
      <div id="contact-response" class="mt-4"></div>
      <div class="mt-8 flex flex-wrap gap-6 text-gray-400">
        <a href="#" class="social-icon"><i class="fab fa-discord text-2xl"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-instagram text-2xl"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-twitter text-2xl"></i></a>
        <a href="#" class="social-icon"><i class="fab fa-youtube text-2xl"></i></a>
      </div>
    </section>
  </main>

  <footer class="bg-[#1a1a1a] border-t border-[#2a2a2a] py-8 px-4 text-center text-gray-400 text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center">
      <div class="flex items-center space-x-4">
        <span class="text-xl font-bold gradient-text">Wolf Society</span>
        <span>© 2026 All rights reserved.</span>
      </div>
      <div class="flex space-x-4 mt-4 md:mt-0">
        <a href="./legal.html" class="hover:text-white transition">Privacy</a>
        <a href="./legal.html" class="hover:text-white transition">Terms</a>
        <a href="./faq.html" class="hover:text-white transition">FAQ</a>
      </div>
    </div>
  </footer>

  <script type="importmap">{
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
    }
  }</script>
  <script type="module">
    import { supabase } from './js/supabase-client.js';
    import { updateNav } from './js/main.js';
    import AOS from 'https://unpkg.com/aos@2.3.1/dist/aos.esm.js';
    AOS.init({ duration: 800, once: true });
    await updateNav();
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      const { error } = await supabase.from('contact_submissions').insert([data]);
      const responseDiv = document.getElementById('contact-response');
      if (error) {
        responseDiv.innerHTML = `<div class="bg-red-800/30 text-red-300 p-3 rounded">Error: ${error.message}</div>`;
      } else {
        responseDiv.innerHTML = `<div class="bg-green-800/30 text-green-300 p-3 rounded">Message sent successfully!</div>`;
        e.target.reset();
      }
    });
  </script>
</body>
</html>
