<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pro Roster — Wolf Society Esports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: { 500: '#6366f1', 600: '#4f46e5' }, darkbg: '#090d16' } } }
    }
  </script>
  <style>.glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }</style>
</head>
<body class="bg-darkbg text-slate-100 font-sans">

  <header class="sticky top-0 z-40 glass-card border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 flex items-center justify-center font-bold text-xl">🐺</div>
        <h1 class="font-black text-xl text-white">WOLF SOCIETY</h1>
      </a>
      <nav class="hidden md:flex gap-8 text-sm font-medium text-slate-300">
        <a href="index.html" class="hover:text-brand-500">Home</a>
        <a href="roster.html" class="text-brand-500 font-bold">Roster</a>
        <a href="matches.html" class="hover:text-brand-500">Match Center</a>
        <a href="tryouts.html" class="hover:text-brand-500">Tryouts</a>
        <a href="about.html" class="hover:text-brand-500">About</a>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-6 md:p-8">
    <div class="mb-8">
      <h1 class="text-3xl font-black text-white">PRO ROSTER & PLAYER STATS</h1>
      <p class="text-xs text-slate-400 mt-1">Real-time stats synced directly from CRM Dashboard.</p>
    </div>

    <!-- Players Grid -->
    <div id="full-roster-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    const supabase = supabase.createClient("YOUR_SUPABASE_URL", "YOUR_SUPABASE_ANON_KEY");

    async function loadRoster() {
      const { data: players } = await supabase.from('players').select('*');
      const grid = document.getElementById('full-roster-grid');

      if (!players || players.length === 0) {
        grid.innerHTML = `<div class="col-span-3 text-center py-12 text-slate-500">No active players found.</div>`;
        return;
      }

      grid.innerHTML = players.map(p => `
        <div class="glass-card p-6 rounded-2xl border border-slate-800 hover:border-brand-500/50 transition">
          <img src="${p.avatar_url || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=500'}" class="w-full h-56 object-cover rounded-xl mb-4" />
          <div class="flex justify-between items-start mb-2">
            <div>
              <h2 class="font-black text-lg text-white">${p.ign}</h2>
              <p class="text-xs text-slate-400">${p.real_name || 'Pro Player'}</p>
            </div>
            <span class="px-2.5 py-1 rounded bg-brand-600/20 text-brand-300 font-bold text-xs uppercase">${p.role}</span>
          </div>

          <div class="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-800 text-center text-xs">
            <div class="bg-slate-900 p-2 rounded.lg">
              <span class="text-slate-400 block text-[10px]">KDA Ratio</span>
              <span class="font-bold text-emerald-400">${p.kda}</span>
            </div>
            <div class="bg-slate-900 p-2 rounded-lg">
              <span class="text-slate-400 block text-[10px]">Win Rate</span>
              <span class="font-bold text-indigo-400">${p.win_rate}%</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', loadRoster);
    
    // Realtime Sync
    supabase.channel('roster-sync').on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, loadRoster).subscribe();
  </script>
</body>
</html>
