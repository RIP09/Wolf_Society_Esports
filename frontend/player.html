<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Society Esports | Player Analytics Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { darkBg: '#060709', cardBg: '#0e1017', borderDark: '#1a1d2e', cyanNeon: '#00f2fe', redNeon: '#ff2a5f', purpleNeon: '#9d4edd' },
          fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Chakra Petch', 'sans-serif'] }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { background-color: #060709; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Chakra Petch', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-8">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SUPABASE_URL = "https://tdfkebgapncswtvbtaqy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZmtlYmdhcG5jc3d0dmJ0YXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTg3MzUsImV4cCI6MjA5NjMzNDczNX0.Aj-GtD5sPCtuHWmZ5ZClSStwa3-b6ENtXr0uYaV-UzQ";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function PlayerDashboard() {
      const [players, setPlayers] = useState([]);
      const [selectedPlayer, setSelectedPlayer] = useState(null);

      const loadData = useCallback(async () => {
        try {
          const { data } = await supabaseClient.from('players').select('*');
          if (data && data.length > 0) {
            setPlayers(data);
            const params = new URLSearchParams(window.location.search);
            const pid = params.get('id');
            const found = data.find(p => p.id === pid);
            setSelectedPlayer(found || data[0]);
          }
        } catch (e) {
          console.error("Player Dashboard Load Error:", e);
        }
      }, []);

      useEffect(() => {
        loadData();

        // Realtime Subscription
        const channel = supabaseClient.channel('player_realtime')
          .on('postgres_changes', { event: '*', schema: 'public' }, () => {
            loadData();
          })
          .subscribe();

        return () => { supabaseClient.removeChannel(channel); };
      }, [loadData]);

      if (!selectedPlayer) {
        return (
          <div class="text-center my-auto space-y-3">
            <div class="font-heading text-xl text-cyanNeon font-bold animate-pulse">Loading Telemetry Stats...</div>
            <p class="text-xs text-gray-500">If no players appear, please add players inside admin.html first.</p>
            <a href="admin.html" class="inline-block px-4 py-2 bg-cyanNeon text-black text-xs font-bold rounded uppercase">Go to Admin CRM</a>
          </div>
        );
      }

      return (
        <div class="max-w-7xl mx-auto w-full space-y-8">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-borderDark pb-6">
            <div>
              <span class="text-purpleNeon font-bold text-xs uppercase tracking-widest">Telemetry & Analytics Portal</span>
              <h1 class="font-heading text-3xl font-bold text-white uppercase">Player Performance Hub</h1>
            </div>
            <div class="flex gap-3">
              <a href="index.html" class="px-4 py-2 bg-cardBg border border-borderDark rounded text-xs font-bold text-gray-300">← Public Website</a>
              <a href="admin.html" class="px-4 py-2 bg-cyanNeon text-black rounded text-xs font-bold">Admin Portal</a>
            </div>
          </div>

          <div class="flex gap-3 overflow-x-auto pb-2">
            {players.map(p => (
              <button
                key={p.id}
                onClick={() => setSelectedPlayer(p)}
                class={`flex items-center gap-2 px-4 py-2 rounded-lg border text-xs font-bold ${selectedPlayer.id === p.id ? 'bg-purpleNeon/20 border-purpleNeon text-white' : 'bg-cardBg border-borderDark text-gray-400'}`}
              >
                <img src={p.avatar_url} class="w-6 h-6 rounded-full object-cover" />
                <span>{p.in_game_name}</span>
              </button>
            ))}
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-4 bg-cardBg border border-borderDark p-6 rounded-xl space-y-6">
              <img src={selectedPlayer.avatar_url} class="w-full h-64 object-cover rounded-xl border border-borderDark" />
              <div>
                <div class="flex justify-between items-center">
                  <h2 class="font-heading text-3xl font-bold text-white">{selectedPlayer.in_game_name}</h2>
                  <span class="px-3 py-1 bg-purpleNeon/10 border border-purpleNeon/30 text-purpleNeon text-xs font-bold uppercase rounded">{selectedPlayer.role}</span>
                </div>
                <div class="text-xs text-gray-400 mt-1">{selectedPlayer.real_name} • Team Divine Wolf</div>
              </div>

              <div class="bg-darkBg p-4 rounded-lg border border-borderDark text-xs text-gray-300 space-y-1">
                <span class="font-bold text-cyanNeon block uppercase">Player Bio</span>
                <p>{selectedPlayer.bio || 'Competitor'}</p>
              </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div class="bg-cardBg border border-borderDark p-5 rounded-xl text-center space-y-1">
                  <span class="text-[10px] text-gray-500 font-bold uppercase">KDA Ratio</span>
                  <div class="font-heading text-3xl font-bold text-cyanNeon">{selectedPlayer.kda}</div>
                </div>
                <div class="bg-cardBg border border-borderDark p-5 rounded-xl text-center space-y-1">
                  <span class="text-[10px] text-gray-500 font-bold uppercase">Win Rate</span>
                  <div class="font-heading text-3xl font-bold text-green-400">{selectedPlayer.win_rate}%</div>
                </div>
                <div class="bg-cardBg border border-borderDark p-5 rounded-xl text-center space-y-1">
                  <span class="text-[10px] text-gray-500 font-bold uppercase">Gold Per Min (GPM)</span>
                  <div class="font-heading text-3xl font-bold text-purpleNeon">{selectedPlayer.gpm || 750}</div>
                </div>
                <div class="bg-cardBg border border-borderDark p-5 rounded-xl text-center space-y-1">
                  <span class="text-[10px] text-gray-500 font-bold uppercase">Matches Played</span>
                  <div class="font-heading text-3xl font-bold text-white">{selectedPlayer.matches_played || 100}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PlayerDashboard />);
  </script>
</body>
</html>
