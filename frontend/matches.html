<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matches · Wolf Society</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- Same header -->
  <header class="fixed top-0 left-0 w-full bg-[#0a0a0a]/90 backdrop-blur-md border-b border-[#2a2a2a] z-50 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <a href="/" class="text-2xl font-bold gradient-text">Wolf Society</a>
      <span class="text-xs text-gray-500 hidden sm:inline">Esports</span>
    </div>
    <nav class="hidden md:flex space-x-6 text-sm font-medium nav-links"></nav>
    <div class="flex items-center space-x-3">
      <button id="mobile-menu-btn" class="md:hidden text-gray-300 text-xl"><i class="fas fa-bars"></i></button>
    </div>
  </header>
  <div id="mobile-menu" class="md:hidden fixed top-16 left-0 w-full bg-[#0a0a0a]/95 backdrop-blur-md border-b border-[#2a2a2a] p-4 flex-col space-y-3 text-sm font-medium z-40 hidden"></div>

  <main class="pt-16">
    <section class="max-w-7xl mx-auto px-4 section-pad">
      <h1 class="text-4xl font-bold mb-8">Matches</h1>
      <div class="flex flex-wrap gap-3 mb-6">
        <button class="match-tab px-4 py-2 rounded bg-[#00f0ff] text-black font-bold" data-status="scheduled">Upcoming</button>
        <button class="match-tab px-4 py-2 rounded bg-[#2a2a2a] text-gray-300" data-status="live">Live</button>
        <button class="match-tab px-4 py-2 rounded bg-[#2a2a2a] text-gray-300" data-status="completed">Completed</button>
      </div>
      <div id="matches-list" class="space-y-4"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="bg-[#1a1a1a] border-t border-[#2a2a2a] py-8 px-4 text-center text-gray-400 text-sm">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center">
      <div class="flex items-center space-x-4">
        <span class="text-xl font-bold gradient-text">Wolf Society</span>
        <span>© 2026 All rights reserved.</span>
      </div>
      <div class="flex space-x-4 mt-4 md:mt-0">
        <a href="./legal.html" class="hover:text-white transition">Privacy</a>
        <a href="./legal.html" class="hover:text-white transition">Terms</a>
        <a href="./faq.html" class="hover:text-white transition">FAQ</a>
      </div>
    </div>
  </footer>

  <script type="importmap">{
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
    }
  }</script>
  <script type="module">
    import { supabase } from './js/supabase-client.js';
    import { updateNav, getMatches } from './js/main.js';
    import AOS from 'https://unpkg.com/aos@2.3.1/dist/aos.esm.js';
    AOS.init({ duration: 800, once: true });
    await updateNav();
    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    });

    const container = document.getElementById('matches-list');
    let currentStatus = 'scheduled';

    function renderMatches(matches) {
      if (matches.length === 0) {
        container.innerHTML = '<p class="text-gray-400">No matches in this category.</p>';
        return;
      }
      container.innerHTML = matches.map(m => `
        <div class="bg-[#1a1a1a] p-4 rounded-xl border border-[#2a2a2a] flex flex-wrap justify-between items-center">
          <div>
            <span class="font-bold text-lg">vs ${m.opponent}</span>
            <span class="text-gray-400 ml-2">${m.tournament?.name || ''}</span>
          </div>
          <div class="text-center">
            ${m.status === 'live' ? '<span class="text-red-500 live-pulse inline-block mr-2">🔴 LIVE</span>' : ''}
            <span class="text-2xl font-bold">${m.team_score} - ${m.opponent_score}</span>
          </div>
          <div class="text-right">
            <div class="text-gray-400">${m.scheduled_at ? new Date(m.scheduled_at).toLocaleString() : 'TBD'}</div>
            ${m.result ? `<span class="text-sm px-2 py-1 rounded ${m.result === 'win' ? 'bg-green-800/30 text-green-300' : 'bg-red-800/30 text-red-300'}">${m.result.toUpperCase()}</span>` : ''}
            ${m.mvp ? `<div class="text-sm text-[#00f0ff]">MVP: ${m.mvp.ign}</div>` : ''}
          </div>
        </div>
      `).join('');
    }

    async function loadMatches(status) {
      const data = await getMatches(status);
      renderMatches(data);
    }

    // Tab switching
    document.querySelectorAll('.match-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.match-tab').forEach(b => {
          b.classList.remove('bg-[#00f0ff]', 'text-black');
          b.classList.add('bg-[#2a2a2a]', 'text-gray-300');
        });
        btn.classList.add('bg-[#00f0ff]', 'text-black');
        currentStatus = btn.dataset.status;
        loadMatches(currentStatus);
      });
    });

    // Initial load
    loadMatches('scheduled');

    // Realtime
    supabase.channel('matches-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'matches' }, () => {
        loadMatches(currentStatus);
      })
      .subscribe();
  </script>
</body>
</html>
