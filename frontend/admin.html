<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Society Esports | Management CRM Platform</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { darkBg: '#060709', cardBg: '#0e1017', borderDark: '#1a1d2e', cyanNeon: '#00f2fe', redNeon: '#ff2a5f', purpleNeon: '#9d4edd' },
          fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Chakra Petch', 'sans-serif'] }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { background-color: #060709; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Chakra Petch', sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col p-4 sm:p-8">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const SUPABASE_URL = "https://tdfkebgapncswtvbtaqy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZmtlYmdhcG5jc3d0dmJ0YXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTg3MzUsImV4cCI6MjA5NjMzNDczNX0.Aj-GtD5sPCtuHWmZ5ZClSStwa3-b6ENtXr0uYaV-UzQ";
    const ORG_EMAIL = "wolfsocietygg@yahoo.com";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function AdminPlatform() {
      const [currentUser, setCurrentUser] = useState(null);
      const [authMode, setAuthMode] = useState('login');
      const [activeTab, setActiveTab] = useState('roster');
      const [msg, setMsg] = useState(null);

      // Auth States
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPass, setLoginPass] = useState('');
      const [regFullName, setRegFullName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPass, setRegPass] = useState('');

      // Data Tables State
      const [players, setPlayers] = useState([]);
      const [matches, setMatches] = useState([]);
      const [contacts, setContacts] = useState([]);
      const [requests, setRequests] = useState([]);
      const [settings, setSettings] = useState({ org_name: 'Wolf Society Esports', org_email: 'wolfsocietygg@yahoo.com', banner_announcement: '', activepieces_webhook: '' });

      // Form Editor States
      const [editingPlayerId, setEditingPlayerId] = useState(null);
      const [playerForm, setPlayerForm] = useState({ in_game_name: '', real_name: '', role: 'Jungler', kda: 4.5, win_rate: 75.0, matches_played: 120, gpm: 780, bio: '', avatar_url: 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=500' });
      const [matchForm, setMatchForm] = useState({ tournament_name: '', stage: 'Group Stage', opponent_name: '', score_team: 0, score_opponent: 0, result: 'WIN' });

      const notify = (type, text) => { setMsg({ type, text }); setTimeout(() => setMsg(null), 4000); };

      const loadAllData = useCallback(async () => {
        try {
          const { data: p, error: pErr } = await supabaseClient.from('players').select('*').order('created_at', { ascending: false });
          const { data: m, error: mErr } = await supabaseClient.from('matches').select('*').order('created_at', { ascending: false });
          const { data: c, error: cErr } = await supabaseClient.from('contacts').select('*').order('created_at', { ascending: false });
          const { data: r, error: rErr } = await supabaseClient.from('admin_requests').select('*').order('created_at', { ascending: false });
          const { data: s, error: sErr } = await supabaseClient.from('site_settings').select('*').single();

          if (pErr) console.error("Player Fetch Error:", pErr);
          if (mErr) console.error("Match Fetch Error:", mErr);

          setPlayers(p || []);
          setMatches(m || []);
          setContacts(c || []);
          setRequests(r || []);
          if (s) setSettings(s);
        } catch (err) {
          console.error("Load Data Failure:", err);
        }
      }, []);

      useEffect(() => {
        if (currentUser) {
          loadAllData();

          // Live channel subscription for Admin CRM
          const channel = supabaseClient.channel('admin_realtime')
            .on('postgres_changes', { event: '*', schema: 'public' }, () => {
              loadAllData();
            })
            .subscribe();

          return () => { supabaseClient.removeChannel(channel); };
        }
      }, [currentUser, loadAllData]);

      // Authentication Handlers
      const handleLogin = async (e) => {
        e.preventDefault();
        try {
          const { data, error } = await supabaseClient.from('admin_requests').select('*').eq('email', loginEmail.trim()).eq('password', loginPass).single();
          if (error || !data) notify('error', 'Invalid admin credentials');
          else if (data.status !== 'APPROVED') notify('error', `Pending approval by Super Admin (${ORG_EMAIL})`);
          else { setCurrentUser(data); notify('success', `Logged in as ${data.full_name}`); }
        } catch (err) {
          notify('error', 'Login system error');
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        const { error } = await supabaseClient.from('admin_requests').insert([{ email: regEmail.trim(), full_name: regFullName, password: regPass, status: 'PENDING' }]);
        if (error) notify('error', error.message);
        else { notify('success', `Access request submitted! Approval sent to ${ORG_EMAIL}.`); setAuthMode('login'); }
      };

      // Player CRUD Operations (Guaranteed Supabase Persistence)
      const savePlayer = async (e) => {
        e.preventDefault();
        try {
          const payload = {
            ...playerForm,
            kda: parseFloat(playerForm.kda) || 0,
            win_rate: parseFloat(playerForm.win_rate) || 0,
            matches_played: parseInt(playerForm.matches_played) || 0,
            gpm: parseInt(playerForm.gpm) || 0
          };

          if (editingPlayerId) {
            const { error } = await supabaseClient.from('players').update(payload).eq('id', editingPlayerId);
            if (error) throw error;
            notify('success', 'Player profile updated in database!');
          } else {
            const { error } = await supabaseClient.from('players').insert([payload]);
            if (error) throw error;
            notify('success', 'New player added to Divine Wolf roster!');
          }

          setPlayerForm({ in_game_name: '', real_name: '', role: 'Jungler', kda: 4.5, win_rate: 75.0, matches_played: 120, gpm: 780, bio: '', avatar_url: 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=500' });
          setEditingPlayerId(null);
          loadAllData();
        } catch (err) {
          notify('error', 'Failed to save player: ' + err.message);
        }
      };

      const deletePlayer = async (id) => {
        if (confirm('Delete player from database?')) {
          const { error } = await supabaseClient.from('players').delete().eq('id', id);
          if (error) notify('error', error.message);
          else { notify('success', 'Player deleted'); loadAllData(); }
        }
      };

      // Save Match Operation
      const saveMatch = async (e) => {
        e.preventDefault();
        try {
          const { error } = await supabaseClient.from('matches').insert([matchForm]);
          if (error) throw error;
          notify('success', 'Match logged successfully!');
          setMatchForm({ tournament_name: '', stage: 'Group Stage', opponent_name: '', score_team: 0, score_opponent: 0, result: 'WIN' });
          loadAllData();
        } catch (err) {
          notify('error', 'Failed to log match: ' + err.message);
        }
      };

      // Update Site Settings
      const updateSettings = async (e) => {
        e.preventDefault();
        try {
          const { error } = await supabaseClient.from('site_settings').update(settings).eq('id', 1);
          if (error) throw error;
          notify('success', 'Global site settings updated!');
        } catch (err) {
          notify('error', err.message);
        }
      };

      if (!currentUser) {
        return (
          <div class="max-w-md mx-auto my-auto w-full bg-cardBg border border-borderDark p-8 rounded-xl space-y-6">
            <div class="text-center space-y-1">
              <div class="w-12 h-12 bg-cyanNeon/10 text-cyanNeon rounded-lg flex items-center justify-center mx-auto text-xl font-bold">WS</div>
              <h1 class="font-heading text-2xl font-bold text-white uppercase">Wolf Society Admin</h1>
              <p class="text-xs text-gray-400">Management CRM & Database Console</p>
            </div>

            {msg && <div class={`p-3 rounded text-xs font-bold border ${msg.type === 'success' ? 'bg-green-500/10 border-green-500/30 text-green-400' : 'bg-redNeon/10 border-redNeon/30 text-redNeon'}`}>{msg.text}</div>}

            {authMode === 'login' ? (
              <form onSubmit={handleLogin} class="space-y-4">
                <input required type="email" placeholder="Email Address" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} class="w-full bg-darkBg border border-borderDark rounded p-3 text-xs text-white" />
                <input required type="password" placeholder="Password" value={loginPass} onChange={e => setLoginPass(e.target.value)} class="w-full bg-darkBg border border-borderDark rounded p-3 text-xs text-white" />
                <button type="submit" class="w-full py-3 bg-cyanNeon text-black font-bold uppercase text-xs rounded">Log In To CRM Dashboard</button>
                <div class="text-center pt-2"><button type="button" onClick={() => setAuthMode('register')} class="text-xs text-gray-400 hover:text-cyanNeon">Request Admin Access</button></div>
              </form>
            ) : (
              <form onSubmit={handleRegister} class="space-y-4">
                <input required type="text" placeholder="Full Name" value={regFullName} onChange={e => setRegFullName(e.target.value)} class="w-full bg-darkBg border border-borderDark rounded p-3 text-xs text-white" />
                <input required type="email" placeholder="Your Email" value={regEmail} onChange={e => setRegEmail(e.target.value)} class="w-full bg-darkBg border border-borderDark rounded p-3 text-xs text-white" />
                <input required type="password" placeholder="Password" value={regPass} onChange={e => setRegPass(e.target.value)} class="w-full bg-darkBg border border-borderDark rounded p-3 text-xs text-white" />
                <button type="submit" class="w-full py-3 bg-redNeon text-white font-bold uppercase text-xs rounded">Submit Access Request</button>
                <div class="text-center pt-2"><button type="button" onClick={() => setAuthMode('login')} class="text-xs text-gray-400 hover:text-cyanNeon">Back To Login</button></div>
              </form>
            )}
          </div>
        );
      }

      return (
        <div class="max-w-7xl mx-auto w-full space-y-6">
          <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-borderDark pb-6">
            <div>
              <span class="text-cyanNeon font-bold text-xs uppercase tracking-widest">Esports CRM Management Hub</span>
              <h1 class="font-heading text-3xl font-bold text-white uppercase">{settings.org_name}</h1>
            </div>
            <div class="flex gap-3">
              <a href="index.html" class="px-3 py-2 bg-cardBg border border-borderDark rounded text-xs font-bold text-gray-300">Public Website</a>
              <a href="player.html" class="px-3 py-2 bg-cardBg border border-purpleNeon/40 text-purpleNeon rounded text-xs font-bold">Player Stats</a>
              <button onClick={() => setCurrentUser(null)} class="px-3 py-2 bg-redNeon/20 border border-redNeon/30 text-redNeon rounded text-xs font-bold">Log Out</button>
            </div>
          </div>

          {msg && <div class={`p-3 rounded text-xs font-bold border ${msg.type === 'success' ? 'bg-green-500/10 border-green-500/30 text-green-400' : 'bg-redNeon/10 border-redNeon/30 text-redNeon'}`}>{msg.text}</div>}

          {/* Navigation Tabs */}
          <div class="flex gap-2 border-b border-borderDark pb-2 overflow-x-auto text-xs font-bold uppercase">
            {[
              { id: 'roster', label: 'Roster Management' },
              { id: 'matches', label: 'Match Center' },
              { id: 'inbox', label: 'Tryouts Inbox' },
              { id: 'settings', label: 'Site & Automation Settings' }
            ].map(t => (
              <button key={t.id} onClick={() => setActiveTab(t.id)} class={`px-4 py-2 rounded ${activeTab === t.id ? 'bg-cyanNeon text-black' : 'bg-cardBg text-gray-400'}`}>
                {t.label}
              </button>
            ))}
          </div>

          {/* TAB 1: ROSTER MANAGER */}
          {activeTab === 'roster' && (
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div class="lg:col-span-5 bg-cardBg border border-borderDark p-6 rounded-xl space-y-4">
                <h3 class="font-heading text-xl font-bold text-white uppercase">{editingPlayerId ? 'Edit Player' : 'Add Player to Roster'}</h3>
                <form onSubmit={savePlayer} class="space-y-3">
                  <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">In-Game IGN *</label>
                    <input required value={playerForm.in_game_name} onChange={e => setPlayerForm({...playerForm, in_game_name: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Real Name</label>
                    <input value={playerForm.real_name || ''} onChange={e => setPlayerForm({...playerForm, real_name: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                  </div>
                  <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Role *</label>
                    <select value={playerForm.role} onChange={e => setPlayerForm({...playerForm, role: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white">
                      {['Jungler', 'Mid Lane', 'Gold Lane', 'EXP Lane', 'Roamer'].map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </div>
                  <div class="grid grid-cols-3 gap-2">
                    <div>
                      <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">KDA</label>
                      <input type="number" step="0.1" value={playerForm.kda} onChange={e => setPlayerForm({...playerForm, kda: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                    </div>
                    <div>
                      <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Win Rate %</label>
                      <input type="number" step="0.1" value={playerForm.win_rate} onChange={e => setPlayerForm({...playerForm, win_rate: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                    </div>
                    <div>
                      <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">GPM</label>
                      <input type="number" value={playerForm.gpm} onChange={e => setPlayerForm({...playerForm, gpm: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase mb-1">Avatar Image URL</label>
                    <input value={playerForm.avatar_url} onChange={e => setPlayerForm({...playerForm, avatar_url: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                  </div>
                  <button type="submit" class="w-full py-2.5 bg-cyanNeon text-black font-bold uppercase text-xs rounded">{editingPlayerId ? 'Update Player Profile' : 'Save To Database & Sync Live'}</button>
                  {editingPlayerId && <button type="button" onClick={() => { setEditingPlayerId(null); setPlayerForm({ in_game_name: '', real_name: '', role: 'Jungler', kda: 4.5, win_rate: 75.0, matches_played: 120, gpm: 780, bio: '', avatar_url: '' }); }} class="w-full py-1.5 bg-gray-700 text-white font-bold uppercase text-xs rounded">Cancel Edit</button>}
                </form>
              </div>

              <div class="lg:col-span-7 bg-cardBg border border-borderDark p-6 rounded-xl space-y-4">
                <h3 class="font-heading text-xl font-bold text-white uppercase">Divine Wolf Database Roster</h3>
                <div class="space-y-3">
                  {players.length === 0 ? <p class="text-xs text-gray-500">No players registered.</p> : players.map(p => (
                    <div key={p.id} class="bg-darkBg border border-borderDark p-3 rounded flex items-center justify-between text-xs">
                      <div class="flex items-center gap-3">
                        <img src={p.avatar_url} class="w-10 h-10 rounded-lg object-cover" />
                        <div>
                          <div class="font-bold text-white">{p.in_game_name} ({p.role})</div>
                          <div class="text-gray-400 text-[10px]">KDA: {p.kda} • WR: {p.win_rate}% • GPM: {p.gpm}</div>
                        </div>
                      </div>
                      <div class="space-x-2">
                        <button onClick={() => { setEditingPlayerId(p.id); setPlayerForm(p); }} class="px-3 py-1 bg-blue-500/20 text-blue-400 rounded">Edit</button>
                        <button onClick={() => deletePlayer(p.id)} class="px-3 py-1 bg-redNeon/20 text-redNeon rounded">Delete</button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB 2: MATCH CENTER */}
          {activeTab === 'matches' && (
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
              <div class="lg:col-span-5 bg-cardBg border border-borderDark p-6 rounded-xl space-y-4">
                <h3 class="font-heading text-xl font-bold text-white uppercase">Log Match Result</h3>
                <form onSubmit={saveMatch} class="space-y-3">
                  <input required placeholder="Tournament Name" value={matchForm.tournament_name} onChange={e => setMatchForm({...matchForm, tournament_name: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                  <input placeholder="Stage (e.g. Grand Finals)" value={matchForm.stage} onChange={e => setMatchForm({...matchForm, stage: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                  <input required placeholder="Opponent Name" value={matchForm.opponent_name} onChange={e => setMatchForm({...matchForm, opponent_name: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                  <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Divine Wolf Score" value={matchForm.score_team} onChange={e => setMatchForm({...matchForm, score_team: parseInt(e.target.value) || 0})} class="bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                    <input type="number" placeholder="Opponent Score" value={matchForm.score_opponent} onChange={e => setMatchForm({...matchForm, score_opponent: parseInt(e.target.value) || 0})} class="bg-darkBg border border-borderDark rounded p-2 text-xs text-white" />
                  </div>
                  <select value={matchForm.result} onChange={e => setMatchForm({...matchForm, result: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2 text-xs text-white">
                    {['WIN', 'LOSS', 'UPCOMING', 'LIVE'].map(r => <option key={r} value={r}>{r}</option>)}
                  </select>
                  <button type="submit" class="w-full py-2 bg-cyanNeon text-black font-bold uppercase text-xs rounded">Save Match</button>
                </form>
              </div>

              <div class="lg:col-span-7 bg-cardBg border border-borderDark p-6 rounded-xl space-y-4">
                <h3 class="font-heading text-xl font-bold text-white uppercase">Match History</h3>
                <div class="space-y-3">
                  {matches.map(m => (
                    <div key={m.id} class="bg-darkBg border border-borderDark p-3 rounded flex justify-between text-xs">
                      <div>
                        <div class="font-bold text-white">Divine Wolf vs {m.opponent_name} ({m.score_team}-{m.score_opponent})</div>
                        <div class="text-gray-400 text-[10px]">{m.tournament_name} • {m.result}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* TAB 3: TRYOUTS CRM INBOX */}
          {activeTab === 'inbox' && (
            <div class="bg-cardBg border border-borderDark p-6 rounded-xl space-y-4">
              <h3 class="font-heading text-xl font-bold text-white uppercase">Tryouts Scouting Applications</h3>
              <div class="space-y-3">
                {contacts.length === 0 ? <p class="text-xs text-gray-500">No applications received yet.</p> : contacts.map(c => (
                  <div key={c.id} class="bg-darkBg border border-borderDark p-4 rounded space-y-2 text-xs">
                    <div class="flex justify-between font-bold text-cyanNeon">
                      <span>{c.ign} ({c.role})</span>
                      <span>Email: {c.email}</span>
                    </div>
                    <div class="text-gray-300">Discord: {c.discord} • Rank: {c.peak_rank || 'N/A'}</div>
                    <div class="text-gray-400">{c.message}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 4: SETTINGS & ACTIVEPIECES AUTOMATION */}
          {activeTab === 'settings' && (
            <div class="bg-cardBg border border-borderDark p-6 rounded-xl space-y-4 max-w-xl">
              <h3 class="font-heading text-xl font-bold text-white uppercase">Site & Activepieces Settings</h3>
              <form onSubmit={updateSettings} class="space-y-3">
                <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Organization Name</label>
                  <input value={settings.org_name} onChange={e => setSettings({...settings, org_name: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2.5 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Org Contact Email</label>
                  <input value={settings.org_email} onChange={e => setSettings({...settings, org_email: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2.5 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Top Announcement Banner</label>
                  <input value={settings.banner_announcement} onChange={e => setSettings({...settings, banner_announcement: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2.5 text-xs text-white" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-cyanNeon uppercase mb-1">Activepieces Webhook URL (Automation Trigger)</label>
                  <input placeholder="https://cloud.activepieces.com/api/v1/webhooks/..." value={settings.activepieces_webhook || ''} onChange={e => setSettings({...settings, activepieces_webhook: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-2.5 text-xs text-white" />
                </div>
                <button type="submit" class="w-full py-2.5 bg-cyanNeon text-black font-bold uppercase text-xs rounded">Update Settings</button>
              </form>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<AdminPlatform />);
  </script>
</body>
</html>
