<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Society CRM — Master Admin Panel</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
            darkbg: '#0f172a',
            cardbg: '#1e293b',
            bordercolor: '#334155'
          }
        }
      }
    }
  </script>
  <style>
    .glass-panel {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="bg-darkbg text-slate-100 font-sans min-h-screen flex flex-col md:flex-row">

  <!-- Sidebar Navigation -->
  <aside class="w-full md:w-64 glass-panel border-r border-slate-800 p-5 flex flex-col justify-between">
    <div>
      <!-- Brand Logo -->
      <div class="flex items-center gap-3 mb-8">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 flex items-center justify-center font-bold text-xl shadow-lg shadow-brand-500/30">
          🐺
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-wide text-white leading-tight">WOLF CRM</h1>
          <p class="text-xs text-slate-400">Esports Admin Suite</p>
        </div>
      </div>

      <!-- Navigation Tabs (A to Z Database Tables) -->
      <nav class="space-y-1.5" id="nav-menu">
        <button onclick="switchTab('admin_users')" id="nav-admin_users" class="nav-btn w-full flex items-center justify-between px-4 py-3 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-800/60 hover:text-white">
          <span class="flex items-center gap-3"><i class="fa-solid fa-user-shield text-indigo-400"></i> Admin Queue</span>
          <span id="badge-pending" class="px-2 py-0.5 text-xs rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 hidden">0</span>
        </button>

        <button onclick="switchTab('matches')" id="nav-matches" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-800/60 hover:text-white">
          <i class="fa-solid fa-gamepad text-cyan-400"></i> Matches & Tournaments
        </button>

        <button onclick="switchTab('players')" id="nav-players" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-800/60 hover:text-white">
          <i class="fa-solid fa-users text-emerald-400"></i> Players Roster
        </button>

        <button onclick="switchTab('teams')" id="nav-teams" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-800/60 hover:text-white">
          <i class="fa-solid fa-sitemap text-purple-400"></i> Teams & Games
        </button>

        <button onclick="switchTab('tryouts')" id="nav-tryouts" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-800/60 hover:text-white">
          <i class="fa-solid fa-clipboard-check text-rose-400"></i> Tryout Applications
        </button>

        <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-800/60 hover:text-white">
          <i class="fa-solid fa-gear text-slate-400"></i> System Settings
        </button>
      </nav>
    </div>

    <!-- Active User Footer -->
    <div class="pt-6 border-t border-slate-800 mt-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs">AD</div>
        <div class="text-xs">
          <p class="font-semibold text-slate-200">Super Admin</p>
          <p class="text-emerald-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Online</p>
        </div>
      </div>
      <button class="text-slate-400 hover:text-rose-400 transition" title="Logout"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>
  </aside>

  <!-- Main Content Workspace -->
  <main class="flex-1 p-6 md:p-8 overflow-y-auto">
    <!-- Top KPI Overview Bar -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
      <div>
        <h2 id="page-title" class="text-2xl font-bold tracking-tight text-white">Admin Queue Management</h2>
        <p class="text-xs text-slate-400 mt-1">Review pending registration requests and authorize admin access.</p>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="refreshCurrentTable()" class="px-4 py-2 text-sm rounded-lg glass-panel text-slate-300 hover:text-white hover:bg-slate-800 transition flex items-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
        <button id="btn-add-record" onclick="openAddModal()" class="px-4 py-2 text-sm rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-medium transition shadow-lg shadow-brand-600/30 flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Record
        </button>
      </div>
    </header>

    <!-- Table Container -->
    <section class="glass-panel rounded-2xl overflow-hidden border border-slate-800">
      <!-- Search & Filter Controls -->
      <div class="p-4 border-b border-slate-800 flex flex-col sm:flex-row justify-between items-center gap-4">
        <div class="relative w-full sm:w-72">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="table-search" placeholder="Search records..." onkeyup="filterTable()" class="w-full pl-9 pr-4 py-2 rounded-lg bg-slate-900/60 border border-slate-700 text-xs text-white focus:outline-none focus:border-brand-500" />
        </div>
        <div class="text-xs text-slate-400" id="record-count">Showing 0 entries</div>
      </div>

      <!-- Dynamic Data Table -->
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead id="table-head" class="bg-slate-900/80 text-xs uppercase tracking-wider text-slate-400 font-semibold border-b border-slate-800">
            <!-- Rendered via JS -->
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-800/60">
            <!-- Data rows injected dynamically -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Add/Edit Record Modal -->
  <div id="modal-form" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modal-title" class="text-lg font-bold text-white">Add New Record</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="dynamic-form" class="space-y-4" onsubmit="handleFormSubmit(event)">
        <!-- Form fields injected dynamically based on current tab -->
        <div id="form-fields" class="space-y-4"></div>
        
        <div class="flex justify-end gap-3 pt-4 border-t border-slate-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white font-semibold text-xs shadow-lg shadow-brand-600/30">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. Initialize Supabase
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeTab = 'admin_users';
    let currentData = [];

    // Mock initial state for Admin Queue demo
    const mockAdminQueue = [
      { id: '1', email: 'alex@wolfsociety.gg', role: 'Editor', status: 'PENDING', requested_at: '2026-07-30' },
      { id: '2', email: 'sarah@wolfsociety.gg', role: 'Match Manager', status: 'APPROVED', requested_at: '2026-07-28' },
      { id: '3', email: 'unknown@guest.com', role: 'Viewer', status: 'REJECTED', requested_at: '2026-07-25' }
    ];

    // Initialize Page
    document.addEventListener('DOMContentLoaded', () => {
      switchTab('admin_users');
    });

    // 2. Tab Navigation Switcher
    function switchTab(tab) {
      activeTab = tab;
      
      // Highlight active nav item
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('bg-brand-600', 'text-white', 'shadow-lg'));
      const activeBtn = document.getElementById(`nav-${tab}`);
      if (activeBtn) activeBtn.classList.add('bg-brand-600', 'text-white', 'shadow-lg');

      // Update titles
      const titles = {
        admin_users: 'Admin Queue & User Access',
        matches: 'Matches & Tournament Schedule',
        players: 'Players & Roster Roster Stats',
        teams: 'Teams & Game Divisions',
        tryouts: 'Tryout Applications Queue',
        settings: 'Global CRM System Settings'
      };
      document.getElementById('page-title').innerText = titles[tab] || 'Database View';

      fetchTableData(tab);
    }

    // 3. Fetch & Render Table Data
    async function fetchTableData(tableName) {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-slate-500"><i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i><p class="text-xs">Loading ${tableName}...</p></td></tr>`;

      let data = [];

      try {
        const { data: dbData, error } = await supabase.from(tableName).select('*');
        if (!error && dbData && dbData.length > 0) {
          data = dbData;
        } else if (tableName === 'admin_users') {
          data = mockAdminQueue; // Fallback mock for demo
        }
      } catch (err) {
        if (tableName === 'admin_users') data = mockAdminQueue;
      }

      currentData = data;
      renderTableUI(tableName, data);
    }

    // 4. Render Table Header & Rows
    function renderTableUI(tableName, data) {
      const thead = document.getElementById('table-head');
      const tbody = document.getElementById('table-body');
      document.getElementById('record-count').innerText = `Showing ${data.length} entries`;

      if (tableName === 'admin_users') {
        thead.innerHTML = `
          <tr>
            <th class="p-4">User / Email</th>
            <th class="p-4">Requested Role</th>
            <th class="p-4">Status</th>
            <th class="p-4">Date</th>
            <th class="p-4 text-right">Actions / Approval</th>
          </tr>
        `;

        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500 text-xs">No pending admin registrations found.</td></tr>`;
          return;
        }

        tbody.innerHTML = data.map(item => `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="p-4 font-semibold text-white">${item.email}</td>
            <td class="p-4 text-xs text-indigo-300 font-mono">${item.role}</td>
            <td class="p-4">
              <span class="px-2.5 py-1 rounded-full text-xs font-semibold ${
                item.status === 'APPROVED' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' :
                item.status === 'PENDING' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' :
                'bg-rose-500/20 text-rose-400 border border-rose-500/30'
              }">
                ${item.status}
              </span>
            </td>
            <td class="p-4 text-xs text-slate-400">${item.requested_at || 'N/A'}</td>
            <td class="p-4 text-right space-x-2">
              ${item.status === 'PENDING' ? `
                <button onclick="updateAdminStatus('${item.id}', 'APPROVED')" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-md text-xs font-semibold transition">Approve</button>
                <button onclick="updateAdminStatus('${item.id}', 'REJECTED')" class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white rounded-md text-xs font-semibold transition">Reject</button>
              ` : `
                <button onclick="deleteRecord('${item.id}')" class="text-slate-400 hover:text-rose-400 text-xs transition"><i class="fa-solid fa-trash"></i></button>
              `}
            </td>
          </tr>
        `).join('');
      } else {
        // Generic fallback auto-renderer for any standard database table
        if (data.length === 0) {
          thead.innerHTML = `<tr><th class="p-4">Records</th></tr>`;
          tbody.innerHTML = `<tr><td class="text-center py-8 text-slate-500 text-xs">No data in table '${tableName}'. Click 'Add Record' to create one.</td></tr>`;
          return;
        }

        const keys = Object.keys(data[0]).slice(0, 5);
        thead.innerHTML = `<tr>${keys.map(k => `<th class="p-4">${k}</th>`).join('')}<th class="p-4 text-right">Actions</th></tr>`;

        tbody.innerHTML = data.map(row => `
          <tr class="hover:bg-slate-800/40 transition">
            ${keys.map(k => `<td class="p-4 text-xs text-slate-300 max-w-xs truncate">${row[k]}</td>`).join('')}
            <td class="p-4 text-right space-x-2">
              <button onclick="deleteRecord('${row.id}')" class="text-slate-400 hover:text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `).join('');
      }
    }

    // 5. Admin Queue Approval Handlers
    async function updateAdminStatus(id, newStatus) {
      const user = mockAdminQueue.find(u => u.id === id);
      if (user) user.status = newStatus;
      
      // Supabase update sync
      await supabase.from('admin_users').update({ status: newStatus }).eq('id', id);
      
      fetchTableData(activeTab);
    }

    // Modal Control Functions
    function openAddModal() {
      document.getElementById('modal-form').classList.remove('hidden');
      document.getElementById('form-fields').innerHTML = `
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Entry Title / Email</label>
          <input type="text" id="input-title" required class="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-xs text-white focus:outline-none focus:border-brand-500" />
        </div>
      `;
    }

    function closeModal() {
      document.getElementById('modal-form').classList.add('hidden');
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      closeModal();
      fetchTableData(activeTab);
    }

    function refreshCurrentTable() {
      fetchTableData(activeTab);
    }

    function filterTable() {
      const term = document.getElementById('table-search').value.toLowerCase();
      const filtered = currentData.filter(item => JSON.stringify(item).toLowerCase().includes(term));
      renderTableUI(activeTab, filtered);
    }

     // Add this inside admin.html <script> section
function setupAdminRealtimeSync() {
  supabase.channel('admin-crm-sync')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'tryouts' }, (payload) => {
      console.log('New Tryout Application Received!', payload);
      // Auto refresh table if active tab is tryouts
      if (activeTab === 'tryouts') fetchTableData('tryouts');
      
      // Optional Notification
      if (payload.eventType === 'INSERT') {
        alert(`🔔 New Tryout Application received from IGN: ${payload.new.ign}`);
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'admin_users' }, () => {
      if (activeTab === 'admin_users') fetchTableData('admin_users');
    })
    .subscribe();
}

// Call on startup
document.addEventListener('DOMContentLoaded', () => {
  setupAdminRealtimeSync();
});

    
  </script>
</body>
</html>
