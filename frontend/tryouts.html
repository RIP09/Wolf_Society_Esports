<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tryouts — Wolf Society Esports</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 500: '#6366f1', 600: '#4f46e5' }, darkbg: '#090d16' } } } }
  </script>
  <style>.glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }</style>
</head>
<body class="bg-darkbg text-slate-100 font-sans">

  <header class="sticky top-0 z-40 glass-card border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 flex items-center justify-center font-bold text-xl">🐺</div>
        <h1 class="font-black text-xl text-white">WOLF SOCIETY</h1>
      </a>
      <nav class="hidden md:flex gap-8 text-sm font-medium text-slate-300">
        <a href="index.html" class="hover:text-brand-500">Home</a>
        <a href="roster.html" class="hover:text-brand-500">Roster</a>
        <a href="matches.html" class="hover:text-brand-500">Match Center</a>
        <a href="tryouts.html" class="text-brand-500 font-bold">Tryouts</a>
        <a href="about.html" class="hover:text-brand-500">About</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto p-6 md:p-12">
    <div class="glass-card rounded-2xl p-8 border border-slate-800 shadow-2xl">
      <h1 class="text-2xl font-black text-white text-center mb-2">JOIN WOLF SOCIETY ACADEMY</h1>
      <p class="text-xs text-slate-400 text-center mb-8">Submit your competitive application directly into our admin review queue.</p>

      <form id="tryout-form" onsubmit="submitTryout(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Full Name</label>
          <input type="text" id="t-name" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">In-Game IGN</label>
            <input type="text" id="t-ign" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Discord Tag</label>
            <input type="text" id="t-discord" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Game</label>
            <select id="t-game" class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white">
              <option value="Mobile Legends">Mobile Legends</option>
              <option value="Valorant">Valorant</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Main Role</label>
            <input type="text" id="t-role" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Rank / Peak Points</label>
          <input type="text" id="t-rank" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-white" />
        </div>

        <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-500 font-bold text-xs text-white shadow-lg transition">Submit Application</button>
      </form>
      <div id="tryout-msg" class="mt-4 text-center text-xs hidden"></div>
    </div>
  </main>

  <script>
    const supabase = supabase.createClient("YOUR_SUPABASE_URL", "YOUR_SUPABASE_ANON_KEY");

    async function submitTryout(e) {
      e.preventDefault();
      const msg = document.getElementById('tryout-msg');

      const payload = {
        full_name: document.getElementById('t-name').value,
        ign: document.getElementById('t-ign').value,
        discord_tag: document.getElementById('t-discord').value,
        game: document.getElementById('t-game').value,
        role: document.getElementById('t-role').value,
        rank: document.getElementById('t-rank').value,
        status: 'PENDING'
      };

      const { error } = await supabase.from('tryouts').insert([payload]);
      msg.classList.remove('hidden');

      if (!error) {
        msg.className = "mt-4 text-center text-xs text-emerald-400 font-bold";
        msg.innerText = "Application received! Our managers will review it in CRM.";
        document.getElementById('tryout-form').reset();
      } else {
        msg.className = "mt-4 text-center text-xs text-rose-400 font-bold";
        msg.innerText = "Submission error. Please check Supabase schema.";
      }
    }
  </script>
</body>
</html>
