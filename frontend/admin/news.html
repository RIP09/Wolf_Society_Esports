<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage News · Wolf Society Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/frontend/css/style.css" />
</head>
<body class="bg-[#0a0a0a] text-gray-200">
  <!-- Same nav as players -->
  <nav class="bg-[#1a1a1a] border-b border-[#2a2a2a] p-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <span class="text-2xl font-bold gradient-text">Wolf Society</span>
      <span class="text-gray-400">Admin</span>
    </div>
    <div class="flex space-x-4">
      <a href="./dashboard.html" class="hover:text-white">Dashboard</a>
      <a href="./players.html" class="hover:text-white">Players</a>
      <a href="./news.html" class="text-[#00f0ff]">News</a>
      <a href="./matches.html" class="hover:text-white">Matches</a>
      <a href="./users.html" class="hover:text-white">Users</a>
      <button id="logout-btn" class="text-red-400 hover:text-red-300">Logout</button>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">News Articles</h1>
      <button id="add-news-btn" class="bg-[#00f0ff] text-black px-4 py-2 rounded font-bold hover:opacity-80">+ Add News</button>
    </div>
    <div id="news-list" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </main>
  <!-- Modal same as earlier with /frontend/ paths -->
  <div id="news-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden">
    <div class="bg-[#1a1a1a] rounded-xl p-6 max-w-2xl w-full border border-[#2a2a2a] max-h-[90vh] overflow-y-auto">
      <h2 id="modal-title" class="text-2xl font-bold mb-4">Add News</h2>
      <form id="news-form">
        <input type="hidden" id="news-id" />
        <div class="space-y-3">
          <input type="text" id="title" placeholder="Title" required class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <input type="text" id="slug" placeholder="Slug" required class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <textarea id="content" placeholder="Content" rows="6" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white"></textarea>
          <input type="text" id="image_url" placeholder="Image URL" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <input type="text" id="category" placeholder="Category" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="is_published" checked />
            <label for="is_published">Published</label>
          </div>
        </div>
        <div class="flex justify-end space-x-3 mt-6">
          <button type="button" id="modal-close" class="px-4 py-2 bg-[#2a2a2a] rounded hover:bg-[#3a3a3a]">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-[#00f0ff] text-black font-bold rounded hover:opacity-80">Save</button>
        </div>
      </form>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
      }
    }
  </script>
  <script type="module">
    import { supabase } from '/frontend/js/supabase-client.js';
    import { getCurrentUser, hasRole, logout } from '/frontend/js/auth.js';

    if (!(await getCurrentUser()) || !(await hasRole('management'))) window.location.href = './index.html';

    async function loadNews() {
      const { data, error } = await supabase.from('news').select('*').order('published_at', { ascending: false });
      if (error) return alert('Error loading news');
      const container = document.getElementById('news-list');
      container.innerHTML = data.map(article => `
        <div class="bg-[#1a1a1a] p-4 rounded-xl border border-[#2a2a2a]">
          <div class="flex justify-between items-start">
            <h3 class="text-xl font-bold">${article.title}</h3>
            <div class="space-x-2">
              <button class="edit-news-btn text-[#00f0ff]" data-id="${article.id}">Edit</button>
              <button class="delete-news-btn text-red-400" data-id="${article.id}">Delete</button>
            </div>
          </div>
          <p class="text-gray-400 text-sm">${article.category || 'Uncategorized'} · ${new Date(article.published_at).toLocaleDateString()}</p>
          <p class="mt-2 text-gray-300 line-clamp-2">${article.content ? article.content.replace(/<[^>]+>/g, '').slice(0, 100) + '...' : ''}</p>
          <span class="inline-block mt-2 text-xs px-2 py-1 rounded ${article.is_published ? 'bg-green-800/30 text-green-300' : 'bg-gray-700/30 text-gray-400'}">${article.is_published ? 'Published' : 'Draft'}</span>
        </div>
      `).join('');
      document.querySelectorAll('.edit-news-btn').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.id)));
      document.querySelectorAll('.delete-news-btn').forEach(btn => btn.addEventListener('click', async () => {
        if (confirm('Delete this article?')) {
          await supabase.from('news').delete().eq('id', btn.dataset.id);
          loadNews();
        }
      }));
    }

    const modal = document.getElementById('news-modal');
    const form = document.getElementById('news-form');
    const modalTitle = document.getElementById('modal-title');
    const closeBtn = document.getElementById('modal-close');

    async function openModal(id = null) {
      if (id) {
        modalTitle.textContent = 'Edit News';
        const { data } = await supabase.from('news').select('*').eq('id', id).single();
        if (data) {
          document.getElementById('news-id').value = data.id;
          document.getElementById('title').value = data.title;
          document.getElementById('slug').value = data.slug;
          document.getElementById('content').value = data.content || '';
          document.getElementById('image_url').value = data.image_url || '';
          document.getElementById('category').value = data.category || '';
          document.getElementById('is_published').checked = data.is_published;
        }
      } else {
        modalTitle.textContent = 'Add News';
        document.getElementById('news-id').value = '';
        form.reset();
      }
      modal.classList.remove('hidden');
    }

    closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    });
    document.getElementById('add-news-btn').addEventListener('click', () => openModal());

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('news-id').value;
      const payload = {
        title: document.getElementById('title').value.trim(),
        slug: document.getElementById('slug').value.trim(),
        content: document.getElementById('content').value.trim() || null,
        image_url: document.getElementById('image_url').value.trim() || null,
        category: document.getElementById('category').value.trim() || null,
        is_published: document.getElementById('is_published').checked,
      };
      let error;
      if (id) {
        ({ error } = await supabase.from('news').update(payload).eq('id', id));
      } else {
        ({ error } = await supabase.from('news').insert([payload]));
      }
      if (error) alert('Error saving news');
      else {
        modal.classList.add('hidden');
        loadNews();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await logout();
      window.location.href = './index.html';
    });

    loadNews();
  </script>
</body>
</html>
