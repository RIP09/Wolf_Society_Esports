<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Players · Wolf Society Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/frontend/css/style.css" />
</head>
<body class="bg-[#0a0a0a] text-gray-200">
  <nav class="bg-[#1a1a1a] border-b border-[#2a2a2a] p-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <span class="text-2xl font-bold gradient-text">Wolf Society</span>
      <span class="text-gray-400">Admin</span>
    </div>
    <div class="flex space-x-4">
      <a href="./dashboard.html" class="hover:text-white">Dashboard</a>
      <a href="./players.html" class="text-[#00f0ff]">Players</a>
      <a href="./news.html" class="hover:text-white">News</a>
      <a href="./matches.html" class="hover:text-white">Matches</a>
      <a href="./users.html" class="hover:text-white">Users</a>
      <button id="logout-btn" class="text-red-400 hover:text-red-300">Logout</button>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">Players</h1>
      <button id="add-player-btn" class="bg-[#00f0ff] text-black px-4 py-2 rounded font-bold hover:opacity-80">+ Add Player</button>
    </div>
    <div class="bg-[#1a1a1a] rounded-xl border border-[#2a2a2a] overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-[#2a2a2a] text-gray-400 uppercase text-sm">
          <tr><th class="px-6 py-3">IGN</th><th class="px-6 py-3">Real Name</th><th class="px-6 py-3">Role</th><th class="px-6 py-3">Active</th><th class="px-6 py-3 text-right">Actions</th></tr>
        </thead>
        <tbody id="players-table"></tbody>
      </table>
    </div>
  </main>

  <!-- Modal -->
  <div id="player-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden">
    <div class="bg-[#1a1a1a] rounded-xl p-6 max-w-md w-full border border-[#2a2a2a]">
      <h2 id="modal-title" class="text-2xl font-bold mb-4">Add Player</h2>
      <form id="player-form">
        <input type="hidden" id="player-id" />
        <div class="space-y-3">
          <input type="text" id="ign" placeholder="IGN" required class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <input type="text" id="real_name" placeholder="Real Name" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <input type="text" id="role" placeholder="Role" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <input type="text" id="country" placeholder="Country" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <input type="number" id="age" placeholder="Age" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <input type="text" id="photo_url" placeholder="Photo URL" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="is_active" checked />
            <label for="is_active">Active</label>
          </div>
        </div>
        <div class="flex justify-end space-x-3 mt-6">
          <button type="button" id="modal-close" class="px-4 py-2 bg-[#2a2a2a] rounded hover:bg-[#3a3a3a]">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-[#00f0ff] text-black font-bold rounded hover:opacity-80">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
      }
    }
  </script>
  <script type="module">
    import { supabase } from '/frontend/js/supabase-client.js';
    import { getCurrentUser, hasRole, logout } from '/frontend/js/auth.js';

    const user = await getCurrentUser();
    if (!user || !(await hasRole('management'))) window.location.href = './index.html';

    async function loadPlayers() {
      const { data, error } = await supabase.from('players').select('*').order('ign');
      if (error) return alert('Error loading players');
      const tbody = document.getElementById('players-table');
      tbody.innerHTML = data.map(p => `
        <tr>
          <td class="px-6 py-3">${p.ign}</td>
          <td class="px-6 py-3">${p.real_name || '-'}</td>
          <td class="px-6 py-3">${p.role || '-'}</td>
          <td class="px-6 py-3">${p.is_active ? '✅' : '❌'}</td>
          <td class="px-6 py-3 text-right space-x-2">
            <button class="edit-btn text-[#00f0ff]" data-id="${p.id}">Edit</button>
            <button class="delete-btn text-red-400" data-id="${p.id}">Delete</button>
          </td>
        </tr>
      `).join('');
      document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.id)));
      document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', async () => {
        if (confirm('Delete this player?')) {
          await supabase.from('players').delete().eq('id', btn.dataset.id);
          loadPlayers();
        }
      }));
    }

    const modal = document.getElementById('player-modal');
    const form = document.getElementById('player-form');
    const modalTitle = document.getElementById('modal-title');
    const closeBtn = document.getElementById('modal-close');

    async function openModal(id = null) {
      if (id) {
        modalTitle.textContent = 'Edit Player';
        const { data } = await supabase.from('players').select('*').eq('id', id).single();
        if (data) {
          document.getElementById('player-id').value = data.id;
          document.getElementById('ign').value = data.ign;
          document.getElementById('real_name').value = data.real_name || '';
          document.getElementById('role').value = data.role || '';
          document.getElementById('country').value = data.country || '';
          document.getElementById('age').value = data.age || '';
          document.getElementById('photo_url').value = data.photo_url || '';
          document.getElementById('is_active').checked = data.is_active;
        }
      } else {
        modalTitle.textContent = 'Add Player';
        document.getElementById('player-id').value = '';
        form.reset();
      }
      modal.classList.remove('hidden');
    }

    closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    });
    document.getElementById('add-player-btn').addEventListener('click', () => openModal());

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('player-id').value;
      const payload = {
        ign: document.getElementById('ign').value.trim(),
        real_name: document.getElementById('real_name').value.trim() || null,
        role: document.getElementById('role').value.trim() || null,
        country: document.getElementById('country').value.trim() || null,
        age: parseInt(document.getElementById('age').value) || null,
        photo_url: document.getElementById('photo_url').value.trim() || null,
        is_active: document.getElementById('is_active').checked,
      };
      let error;
      if (id) {
        ({ error } = await supabase.from('players').update(payload).eq('id', id));
      } else {
        ({ error } = await supabase.from('players').insert([payload]));
      }
      if (error) alert('Error saving player');
      else {
        modal.classList.add('hidden');
        loadPlayers();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await logout();
      window.location.href = './index.html';
    });

    loadPlayers();
  </script>
</body>
</html>
