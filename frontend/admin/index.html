<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login · Wolf Society</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/frontend/css/style.css" />
</head>
<body class="bg-[#0a0a0a] flex items-center justify-center min-h-screen">
  <div class="w-full max-w-md p-8 bg-[#1a1a1a] rounded-2xl shadow-2xl border border-[#2a2a2a]">
    <h1 class="text-3xl font-bold text-center gradient-text mb-6">Admin Panel</h1>
    <form id="admin-login" class="space-y-4">
      <input type="email" id="admin-email" placeholder="Email" required class="w-full px-4 py-3 bg-[#2a2a2a] border border-[#3a3a3a] rounded-lg text-white focus:ring-2 focus:ring-[#00f0ff] outline-none" />
      <input type="password" id="admin-password" placeholder="Password" required class="w-full px-4 py-3 bg-[#2a2a2a] border border-[#3a3a3a] rounded-lg text-white focus:ring-2 focus:ring-[#00f0ff] outline-none" />
      <button type="submit" class="w-full py-3 bg-gradient-to-r from-[#00f0ff] to-[#ff2d55] text-black font-bold rounded-lg hover:opacity-90 transition">Login</button>
    </form>
    <div id="login-error" class="text-red-400 text-sm mt-2 hidden"></div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
      }
    }
  </script>
  <script type="module">
    import { login, getCurrentUser, hasRole } from '/frontend/js/auth.js';
    const form = document.getElementById('admin-login');
    const errorDiv = document.getElementById('login-error');
    const user = await getCurrentUser();
    if (user && await hasRole('management')) {
      window.location.href = './dashboard.html';
    }
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.add('hidden');
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      try {
        await login(email, password);
        const userNow = await getCurrentUser();
        if (userNow && await hasRole('management')) {
          window.location.href = './dashboard.html';
        } else {
          throw new Error('You do not have management/admin privileges.');
        }
      } catch (err) {
        errorDiv.textContent = err.message || 'Login failed.';
        errorDiv.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
