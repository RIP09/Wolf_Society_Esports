<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../css/style.css" />
  <!-- FontAwesome, fonts, etc. -->
</head>
<body>
  <!-- Same navbar as public pages -->
  <nav class="navbar">...</nav>

  <section class="section" style="padding-top:8rem;">
    <div class="container">
      <h1>Admin Dashboard</h1>
      <div class="admin-grid">
        <div class="admin-card">
          <div class="card-icon">👥</div>
          <h3>Users</h3>
          <p>Manage players and staff</p>
          <a href="users.html" class="btn btn-primary btn-sm btn-slide">
            <span class="original">Manage</span>
            <span class="hover-text">Go</span>
          </a>
        </div>
        <div class="admin-card">
          <div class="card-icon">🏆</div>
          <h3>Matches</h3>
          <p>Edit scores, schedule</p>
          <a href="matches.html" class="btn btn-primary btn-sm btn-ripple">Edit</a>
        </div>
        <div class="admin-card">
          <div class="card-icon">📰</div>
          <h3>News</h3>
          <p>Create and publish</p>
          <a href="news.html" class="btn btn-primary btn-sm btn-pulse">Publish</a>
        </div>
      </div>
      <!-- Example toggle switch -->
      <div style="margin-top:2rem;">
        <label class="switch">
          <input type="checkbox" id="maintenanceMode">
          <span class="slider"></span>
        </label>
        <span style="margin-left:0.5rem;">Maintenance mode</span>
      </div>
      <!-- Modal trigger -->
      <button class="btn btn-outline" data-modal-open="announceModal">Announce</button>
    </div>
  </section>

  <!-- Modal -->
  <div class="modal-overlay" id="announceModal">
    <div class="modal">
      <button class="close-btn">&times;</button>
      <h2>Announcement</h2>
      <textarea class="input-focus" rows="4" placeholder="Type announcement..."></textarea>
      <button class="btn btn-primary btn-ripple" style="margin-top:1rem;">Send</button>
    </div>
  </div>

  <footer class="footer">...</footer>
  <script src="../js/supabase-client.js" type="module"></script>
  <script src="../js/auth.js" type="module"></script>
  <script src="../js/main.js" type="module"></script>
</body>
</html>
