<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard · Wolf Society</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-[#0a0a0a] text-gray-200">
  <nav class="bg-[#1a1a1a] border-b border-[#2a2a2a] p-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <span class="text-2xl font-bold gradient-text">Wolf Society</span>
      <span class="text-gray-400">Admin</span>
    </div>
    <div class="flex space-x-4">
      <a href="./dashboard.html" class="text-[#00f0ff]">Dashboard</a>
      <a href="./players.html" class="hover:text-white">Players</a>
      <a href="./news.html" class="hover:text-white">News</a>
      <a href="./matches.html" class="hover:text-white">Matches</a>
      <a href="./users.html" class="hover:text-white">Users</a>
      <button id="logout-btn" class="text-red-400 hover:text-red-300">Logout</button>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">Admin Dashboard</h1>
    <div id="stats" class="grid grid-cols-1 md:grid-cols-4 gap-6">
      <!-- loaded by JS -->
    </div>
    <div class="grid grid-cols-2 gap-4 mt-8">
      <a href="./players.html" class="bg-[#1a1a1a] p-6 rounded-xl border border-[#2a2a2a] text-center hover:border-[#00f0ff]">Manage Players</a>
      <a href="./news.html" class="bg-[#1a1a1a] p-6 rounded-xl border border-[#2a2a2a] text-center hover:border-[#00f0ff]">Manage News</a>
      <a href="./matches.html" class="bg-[#1a1a1a] p-6 rounded-xl border border-[#2a2a2a] text-center hover:border-[#00f0ff]">Manage Matches</a>
      <a href="./users.html" class="bg-[#1a1a1a] p-6 rounded-xl border border-[#2a2a2a] text-center hover:border-[#00f0ff]">Manage Users</a>
    </div>
  </main>
  <script type="importmap">{
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
    }
  }</script>
  <script type="module">
    import { supabase } from '../js/supabase-client.js';
    import { getCurrentUser, hasRole, logout } from '../js/auth.js';
    // Check admin
    const user = await getCurrentUser();
    if (!user || !(await hasRole('management'))) {
      window.location.href = './index.html';
    }
    // Stats
    const [playersCount, newsCount, matchesCount, usersCount] = await Promise.all([
      supabase.from('players').select('id', { count: 'exact', head: true }),
      supabase.from('news').select('id', { count: 'exact', head: true }),
      supabase.from('matches').select('id', { count: 'exact', head: true }),
      supabase.from('profiles').select('id', { count: 'exact', head: true })
    ]);
    document.getElementById('stats').innerHTML = `
      <div class="bg-[#1a1a1a] p-4 rounded-xl"><h3>Players</h3><p class="text-2xl font-bold">${playersCount.count || 0}</p></div>
      <div class="bg-[#1a1a1a] p-4 rounded-xl"><h3>News</h3><p class="text-2xl font-bold">${newsCount.count || 0}</p></div>
      <div class="bg-[#1a1a1a] p-4 rounded-xl"><h3>Matches</h3><p class="text-2xl font-bold">${matchesCount.count || 0}</p></div>
      <div class="bg-[#1a1a1a] p-4 rounded-xl"><h3>Users</h3><p class="text-2xl font-bold">${usersCount.count || 0}</p></div>
    `;
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await logout();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
