<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Matches · Wolf Society Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="/frontend/css/style.css" />
</head>
<body class="bg-[#0a0a0a] text-gray-200">
  <!-- Same nav -->
  <nav class="bg-[#1a1a1a] border-b border-[#2a2a2a] p-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <span class="text-2xl font-bold gradient-text">Wolf Society</span>
      <span class="text-gray-400">Admin</span>
    </div>
    <div class="flex space-x-4">
      <a href="./dashboard.html" class="hover:text-white">Dashboard</a>
      <a href="./players.html" class="hover:text-white">Players</a>
      <a href="./news.html" class="hover:text-white">News</a>
      <a href="./matches.html" class="text-[#00f0ff]">Matches</a>
      <a href="./users.html" class="hover:text-white">Users</a>
      <button id="logout-btn" class="text-red-400 hover:text-red-300">Logout</button>
    </div>
  </nav>
  <main class="max-w-7xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold">Matches</h1>
      <button id="add-match-btn" class="bg-[#00f0ff] text-black px-4 py-2 rounded font-bold hover:opacity-80">+ Add Match</button>
    </div>
    <div class="bg-[#1a1a1a] rounded-xl border border-[#2a2a2a] overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-[#2a2a2a] text-gray-400 uppercase text-sm">
          <tr><th class="px-6 py-3">Opponent</th><th class="px-6 py-3">Tournament</th><th class="px-6 py-3">Status</th><th class="px-6 py-3">Scheduled</th><th class="px-6 py-3">Score</th><th class="px-6 py-3 text-right">Actions</th></tr>
        </thead>
        <tbody id="matches-table"></tbody>
      </table>
    </div>
  </main>
  <!-- Modal with /frontend/ paths -->
  <div id="match-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden">
    <div class="bg-[#1a1a1a] rounded-xl p-6 max-w-md w-full border border-[#2a2a2a]">
      <h2 id="modal-title" class="text-2xl font-bold mb-4">Add Match</h2>
      <form id="match-form">
        <input type="hidden" id="match-id" />
        <div class="space-y-3">
          <input type="text" id="opponent" placeholder="Opponent Team" required class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <input type="text" id="tournament_name" placeholder="Tournament Name" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <select id="status" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white">
            <option value="scheduled">Scheduled</option>
            <option value="live">Live</option>
            <option value="completed">Completed</option>
          </select>
          <input type="datetime-local" id="scheduled_at" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          <div class="flex space-x-2">
            <input type="number" id="team_score" placeholder="Team Score" class="w-1/2 px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
            <input type="number" id="opponent_score" placeholder="Opponent Score" class="w-1/2 px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white" />
          </div>
          <select id="result" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white">
            <option value="">Result</option>
            <option value="win">Win</option>
            <option value="loss">Loss</option>
            <option value="draw">Draw</option>
          </select>
          <select id="mvp_id" class="w-full px-4 py-2 bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white">
            <option value="">MVP (optional)</option>
          </select>
        </div>
        <div class="flex justify-end space-x-3 mt-6">
          <button type="button" id="modal-close" class="px-4 py-2 bg-[#2a2a2a] rounded hover:bg-[#3a3a3a]">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-[#00f0ff] text-black font-bold rounded hover:opacity-80">Save</button>
        </div>
      </form>
    </div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
      }
    }
  </script>
  <script type="module">
    import { supabase } from '/frontend/js/supabase-client.js';
    import { getCurrentUser, hasRole, logout } from '/frontend/js/auth.js';

    if (!(await getCurrentUser()) || !(await hasRole('management'))) window.location.href = './index.html';

    async function loadPlayersOptions() {
      const { data } = await supabase.from('players').select('id, ign').eq('is_active', true);
      const select = document.getElementById('mvp_id');
      select.innerHTML = '<option value="">MVP (optional)</option>' + data.map(p => `<option value="${p.id}">${p.ign}</option>`).join('');
    }
    await loadPlayersOptions();

    async function loadMatches() {
      const { data, error } = await supabase.from('matches').select('*, tournament: tournament_id(name), mvp: mvp_id(ign)').order('scheduled_at', { ascending: true });
      if (error) return alert('Error loading matches');
      const tbody = document.getElementById('matches-table');
      tbody.innerHTML = data.map(m => `
        <tr>
          <td class="px-6 py-3">${m.opponent}</td>
          <td class="px-6 py-3">${m.tournament?.name || 'N/A'}</td>
          <td class="px-6 py-3"><span class="px-2 py-1 text-xs rounded ${m.status === 'live' ? 'bg-red-800/30 text-red-300' : m.status === 'completed' ? 'bg-green-800/30 text-green-300' : 'bg-yellow-800/30 text-yellow-300'}">${m.status}</span></td>
          <td class="px-6 py-3">${m.scheduled_at ? new Date(m.scheduled_at).toLocaleString() : '-'}</td>
          <td class="px-6 py-3">${m.team_score} - ${m.opponent_score}</td>
          <td class="px-6 py-3 text-right space-x-2">
            <button class="edit-match-btn text-[#00f0ff]" data-id="${m.id}">Edit</button>
            <button class="delete-match-btn text-red-400" data-id="${m.id}">Delete</button>
          </td>
        </tr>
      `).join('');
      document.querySelectorAll('.edit-match-btn').forEach(btn => btn.addEventListener('click', () => openModal(btn.dataset.id)));
      document.querySelectorAll('.delete-match-btn').forEach(btn => btn.addEventListener('click', async () => {
        if (confirm('Delete this match?')) {
          await supabase.from('matches').delete().eq('id', btn.dataset.id);
          loadMatches();
        }
      }));
    }

    const modal = document.getElementById('match-modal');
    const form = document.getElementById('match-form');
    const modalTitle = document.getElementById('modal-title');
    const closeBtn = document.getElementById('modal-close');

    async function openModal(id = null) {
      if (id) {
        modalTitle.textContent = 'Edit Match';
        const { data } = await supabase.from('matches').select('*').eq('id', id).single();
        if (data) {
          document.getElementById('match-id').value = data.id;
          document.getElementById('opponent').value = data.opponent;
          document.getElementById('tournament_name').value = data.tournament_id || '';
          document.getElementById('status').value = data.status;
          document.getElementById('scheduled_at').value = data.scheduled_at ? data.scheduled_at.slice(0, 16) : '';
          document.getElementById('team_score').value = data.team_score || '';
          document.getElementById('opponent_score').value = data.opponent_score || '';
          document.getElementById('result').value = data.result || '';
          document.getElementById('mvp_id').value = data.mvp_id || '';
        }
      } else {
        modalTitle.textContent = 'Add Match';
        document.getElementById('match-id').value = '';
        form.reset();
      }
      modal.classList.remove('hidden');
    }

    closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.add('hidden');
    });
    document.getElementById('add-match-btn').addEventListener('click', () => openModal());

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('match-id').value;
      const tournamentName = document.getElementById('tournament_name').value.trim();
      let tournamentId = null;
      if (tournamentName) {
        let { data: existing } = await supabase.from('tournaments').select('id').eq('name', tournamentName).maybeSingle();
        if (!existing) {
          const { data: newTourn, error: tErr } = await supabase.from('tournaments').insert([{ name: tournamentName }]).select().single();
          if (tErr) return alert('Error creating tournament');
          tournamentId = newTourn.id;
        } else {
          tournamentId = existing.id;
        }
      }
      const payload = {
        opponent: document.getElementById('opponent').value.trim(),
        tournament_id: tournamentId,
        status: document.getElementById('status').value,
        scheduled_at: document.getElementById('scheduled_at').value || null,
        team_score: parseInt(document.getElementById('team_score').value) || 0,
        opponent_score: parseInt(document.getElementById('opponent_score').value) || 0,
        result: document.getElementById('result').value || null,
        mvp_id: document.getElementById('mvp_id').value || null,
      };
      let error;
      if (id) {
        ({ error } = await supabase.from('matches').update(payload).eq('id', id));
      } else {
        ({ error } = await supabase.from('matches').insert([payload]));
      }
      if (error) alert('Error saving match');
      else {
        modal.classList.add('hidden');
        loadMatches();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await logout();
      window.location.href = './index.html';
    });

    loadMatches();
  </script>
</body>
</html>
