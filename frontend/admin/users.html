<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Users · Wolf Society Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="bg-[#0a0a0a] text-gray-200">
  <nav class="bg-[#1a1a1a] border-b border-[#2a2a2a] p-4 flex justify-between items-center">
    <div class="flex items-center space-x-4">
      <span class="text-2xl font-bold gradient-text">Wolf Society</span>
      <span class="text-gray-400">Admin</span>
    </div>
    <div class="flex space-x-4">
      <a href="./dashboard.html" class="hover:text-white">Dashboard</a>
      <a href="./players.html" class="hover:text-white">Players</a>
      <a href="./news.html" class="hover:text-white">News</a>
      <a href="./matches.html" class="hover:text-white">Matches</a>
      <a href="./users.html" class="text-[#00f0ff]">Users</a>
      <button id="logout-btn" class="text-red-400 hover:text-red-300">Logout</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6">
    <h1 class="text-3xl font-bold mb-6">User Management</h1>
    <div class="bg-[#1a1a1a] rounded-xl border border-[#2a2a2a] overflow-x-auto">
      <table class="w-full text-left">
        <thead class="bg-[#2a2a2a] text-gray-400 uppercase text-sm">
          <tr><th class="px-6 py-3">Username</th><th class="px-6 py-3">Full Name</th><th class="px-6 py-3">Email</th><th class="px-6 py-3">Role</th><th class="px-6 py-3">Actions</th></tr>
        </thead>
        <tbody id="users-table"></tbody>
      </table>
    </div>
  </main>

  <script type="importmap">{
    "imports": {
      "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"
    }
  }</script>
  <script type="module">
    import { supabase } from '../js/supabase-client.js';
    import { getCurrentUser, isSuperAdmin, logout } from '../js/auth.js';

    // Auth check: only super_admin can access this page
    const user = await getCurrentUser();
    if (!user || !(await isSuperAdmin())) {
      alert('You do not have permission to manage users.');
      window.location.href = './dashboard.html';
    }

    // Load users (profiles joined with auth.users to get email)
    async function loadUsers() {
      // We can fetch from profiles and then get emails from auth.users (requires admin access)
      // Supabase admin API can list users, but we'll use profiles with email from auth.users using a join? Not directly.
      // Alternative: use the admin API with service role key. For simplicity, we'll assume profiles table has email column? We'll add email to profiles.
      // Actually, we can use the admin API. But we'll just show what we have.
      // Let's use the admin API: we need service role key. Not recommended in frontend.
      // For demo, we'll fetch profiles and assume we have email in profiles (we'll add a trigger to sync).
      // Instead, we'll just manage roles based on existing profiles. We'll not show email.
      // We'll add email later. Let's just show username, full_name, role.
      const { data, error } = await supabase.from('profiles').select('id, username, full_name, role').order('username');
      if (error) return alert('Error loading users');
      const tbody = document.getElementById('users-table');
      tbody.innerHTML = data.map(p => `
        <tr>
          <td class="px-6 py-3">${p.username || 'N/A'}</td>
          <td class="px-6 py-3">${p.full_name || '-'}</td>
          <td class="px-6 py-3">${p.email || 'N/A'}</td>
          <td class="px-6 py-3"><span class="capitalize">${p.role}</span></td>
          <td class="px-6 py-3">
            <select class="role-select bg-[#2a2a2a] border border-[#3a3a3a] rounded text-white p-1" data-id="${p.id}">
              <option value="public" ${p.role === 'public' ? 'selected' : ''}>Public</option>
              <option value="user" ${p.role === 'user' ? 'selected' : ''}>User</option>
              <option value="management" ${p.role === 'management' ? 'selected' : ''}>Management</option>
              <option value="admin" ${p.role === 'admin' ? 'selected' : ''}>Admin</option>
              <option value="super_admin" ${p.role === 'super_admin' ? 'selected' : ''}>Super Admin</option>
            </select>
            <button class="update-role-btn text-[#00f0ff] ml-2" data-id="${p.id}">Update</button>
          </td>
        </tr>
      `).join('');
      // Attach events
      document.querySelectorAll('.update-role-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.dataset.id;
          const select = document.querySelector(`.role-select[data-id="${id}"]`);
          const newRole = select.value;
          const { error } = await supabase.from('profiles').update({ role: newRole }).eq('id', id);
          if (error) alert('Error updating role');
          else loadUsers();
        });
      });
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await logout();
      window.location.href = './index.html';
    });

    loadUsers();
  </script>
</body>
</html>
