<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>Wolf Society Esports</title>

  <!-- ===== MODERN FONTS ===== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Outfit:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <!-- ===== LUCIDE ICONS ===== -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- ===== GSAP + SCROLLTRIGGER ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- ===== CHART.JS ===== -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- ===== THREE.JS ===== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- ===== STYLES ===== (same as previous, but included here for completeness) -->
  <style>
    /* ============================================================
       ROOT VARIABLES – LIGHT THEME (default)
       ============================================================ */
    :root {
      --bg-primary: #f8fafc;
      --bg-secondary: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.75);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent-teal: #0ea5e9;
      --accent-rose: #f43f5e;
      --accent-gold: #f59e0b;
      --border-color: rgba(203, 213, 225, 0.4);
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-display: 'Outfit', 'Inter', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    .dark {
      --bg-primary: #0B0F19;
      --bg-secondary: #111827;
      --bg-card: rgba(17, 24, 39, 0.8);
      --text-primary: #F0F6FC;
      --text-secondary: #8B949E;
      --text-muted: #6B7280;
      --border-color: rgba(255, 255, 255, 0.06);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* ----- RESET & BASE ----- */
    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
      overflow-x:hidden;
      transition: background 0.3s, color 0.3s;
      position:relative;
    }
    body::before {
      content:'';
      position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:0.04;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }
    ::selection { background:var(--accent-teal); color:#fff; }
    ::-webkit-scrollbar { width:8px; }
    ::-webkit-scrollbar-track { background:var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background:var(--accent-teal); border-radius:10px; }
    a { color:inherit; text-decoration:none; }
    ul, ol { list-style:none; }
    img { max-width:100%; display:block; }
    button, input, select, textarea { font-family:inherit; font-size:inherit; line-height:inherit; }
    button { cursor:pointer; border:none; background:none; color:inherit; }

    /* ----- UTILITIES ----- */
    .container { max-width:1280px; margin:0 auto; padding:0 1.5rem; }
    .flex { display:flex; }
    .flex-col { flex-direction:column; }
    .items-center { align-items:center; }
    .justify-between { justify-content:space-between; }
    .gap-1 { gap:0.5rem; }
    .gap-2 { gap:1rem; }
    .gap-3 { gap:1.5rem; }
    .grid { display:grid; }
    .grid-cols-1 { grid-template-columns:1fr; }
    .grid-cols-2 { grid-template-columns:repeat(2,1fr); }
    .grid-cols-3 { grid-template-columns:repeat(3,1fr); }
    .grid-cols-4 { grid-template-columns:repeat(4,1fr); }
    .text-center { text-align:center; }
    .text-left { text-align:left; }
    .text-right { text-align:right; }
    .w-full { width:100%; }
    .h-full { height:100%; }
    .p-1 { padding:0.5rem; }
    .p-2 { padding:1rem; }
    .p-3 { padding:1.5rem; }
    .p-4 { padding:2rem; }
    .m-1 { margin:0.5rem; }
    .m-2 { margin:1rem; }
    .mt-2 { margin-top:1rem; }
    .mt-3 { margin-top:1.5rem; }
    .mt-4 { margin-top:2rem; }
    .mb-2 { margin-bottom:1rem; }
    .mb-3 { margin-bottom:1.5rem; }
    .mb-4 { margin-bottom:2rem; }
    .rounded { border-radius:var(--radius); }
    .rounded-full { border-radius:9999px; }
    .shadow { box-shadow:var(--shadow); }
    .hidden { display:none !important; }
    .block { display:block; }
    .relative { position:relative; }
    .absolute { position:absolute; }
    .fixed { position:fixed; }
    .z-10 { z-index:10; }
    .z-20 { z-index:20; }
    .z-50 { z-index:50; }
    .z-100 { z-index:100; }
    .z-999 { z-index:999; }
    .z-9999 { z-index:9999; }

    /* ----- COMPONENTS ----- */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:0.5rem;
      padding:0.65rem 1.4rem; border:none; border-radius:var(--radius);
      font-weight:600; font-size:0.875rem; transition:var(--transition);
      cursor:pointer; text-decoration:none; position:relative; overflow:hidden;
    }
    .btn-primary { background:var(--accent-teal); color:#fff; }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 0 30px rgba(14,165,233,0.25); }
    .btn-secondary { background:var(--accent-rose); color:#fff; }
    .btn-secondary:hover { transform:translateY(-2px); box-shadow:0 0 30px rgba(244,63,94,0.25); }
    .btn-outline { background:transparent; border:1px solid var(--border-color); color:var(--text-primary); }
    .btn-outline:hover { background:rgba(0,0,0,0.02); border-color:var(--accent-teal); }
    .btn-glow {
      position:relative; background:transparent; color:var(--accent-teal);
      padding:0.8rem 2rem; border-radius:var(--radius); font-weight:700; font-size:1rem;
      transition:var(--transition);
    }
    .btn-glow svg { position:absolute; inset:-2px; width:calc(100%+4px); height:calc(100%+4px); pointer-events:none; }
    .btn-glow svg rect { fill:none; stroke:var(--accent-teal); stroke-width:2; stroke-dasharray:400; stroke-dashoffset:400; transition:stroke-dashoffset 0.6s ease; }
    .btn-glow:hover svg rect { stroke-dashoffset:0; }
    .btn-glow:hover { box-shadow:0 0 40px rgba(14,165,233,0.12); transform:scale(1.02); }

    .card {
      background:var(--bg-card); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
      border:1px solid var(--border-color); border-radius:var(--radius); padding:1.5rem;
      box-shadow:var(--shadow); transition:var(--transition);
    }
    .card:hover { transform:translateY(-4px); border-color:rgba(14,165,233,0.2); box-shadow:0 12px 48px rgba(0,0,0,0.06); }
    .card-title { font-family:var(--font-display); font-weight:700; font-size:1.125rem; color:var(--text-primary); margin-bottom:0.5rem; }
    .card-subtitle { font-size:0.875rem; color:var(--text-secondary); }

    .form-group { margin-bottom:1rem; }
    .form-group label { display:block; margin-bottom:0.25rem; font-weight:600; font-size:0.8125rem; color:var(--text-secondary); letter-spacing:0.02em; }
    .form-control {
      width:100%; padding:0.65rem 1rem; border:1px solid var(--border-color); border-radius:var(--radius);
      background:rgba(255,255,255,0.5); color:var(--text-primary); font-size:0.875rem;
      transition:var(--transition); appearance:none;
    }
    .form-control:focus { border-color:var(--accent-teal); outline:none; box-shadow:0 0 0 4px rgba(14,165,233,0.1); }
    .form-control::placeholder { color:var(--text-muted); }

    .table-container { overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border-color); background:var(--bg-card); backdrop-filter:blur(4px); }
    table { width:100%; border-collapse:collapse; font-size:0.875rem; }
    table thead { background:rgba(0,0,0,0.02); }
    table th { padding:0.75rem 1rem; text-align:left; font-weight:600; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-secondary); border-bottom:1px solid var(--border-color); }
    table td { padding:0.75rem 1rem; border-bottom:1px solid var(--border-color); color:var(--text-primary); vertical-align:middle; }
    table tbody tr:hover { background:rgba(0,0,0,0.01); }

    .toggle-3d {
      position:relative; width:60px; height:30px; background:var(--bg-secondary); border-radius:30px;
      border:2px solid var(--border-color); cursor:pointer; transition:var(--transition);
      perspective:100px; box-shadow:inset 0 2px 4px rgba(0,0,0,0.04);
    }
    .toggle-3d .ball {
      position:absolute; top:2px; left:2px; width:22px; height:22px;
      background:radial-gradient(circle at 30% 30%, #fff, #d1d5db);
      border-radius:50%; transition:var(--transition);
      transform:translateX(0) rotateY(0deg);
      box-shadow:0 2px 8px rgba(0,0,0,0.08);
    }
    .toggle-3d.active { background:var(--accent-teal); }
    .toggle-3d.active .ball { transform:translateX(30px) rotateY(180deg); }

    /* Preloader */
    #preloader {
      position:fixed; inset:0; background:var(--bg-primary); z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      transition:opacity 0.8s ease, visibility 0.8s ease;
    }
    #preloader.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    #preloader .loader-logo { font-family:var(--font-display); font-size:3rem; font-weight:900; color:var(--accent-teal); animation:pulseLoader 1.2s ease-in-out infinite; }
    #preloader .loader-logo span { color:var(--text-primary); }
    #preloader .loader-bar { width:200px; height:4px; background:var(--border-color); border-radius:4px; margin-top:1.5rem; overflow:hidden; position:relative; }
    #preloader .loader-bar::after { content:''; position:absolute; inset:0; width:0%; background:linear-gradient(90deg, var(--accent-teal), var(--accent-rose)); border-radius:4px; animation:loadProgress 2s ease-in-out forwards; }
    @keyframes loadProgress { 0% { width:0%; } 100% { width:100%; } }
    @keyframes pulseLoader { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }

    /* Page transition */
    .page-transition { opacity:0; transform:translateY(20px); animation:pageIn 0.6s ease forwards; }
    @keyframes pageIn { to { opacity:1; transform:translateY(0); } }

    /* Navbar */
    .navbar {
      background:rgba(255,255,255,0.8); backdrop-filter:blur(12px); border-bottom:1px solid var(--border-color);
      padding:0.75rem 1.5rem; position:sticky; top:0; z-index:100;
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:1rem;
    }
    .navbar .brand { font-family:var(--font-display); font-size:1.5rem; font-weight:900; color:var(--accent-teal); }
    .navbar .brand span { color:var(--text-primary); }
    .navbar .nav-links { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; }
    .navbar .nav-links a { color:var(--text-secondary); padding:0.4rem 0.8rem; border-radius:6px; font-size:0.875rem; font-weight:500; transition:var(--transition); }
    .navbar .nav-links a:hover { color:var(--text-primary); background:rgba(0,0,0,0.02); }
    .navbar .nav-links a.active { color:var(--accent-teal); background:rgba(14,165,233,0.06); }
    .navbar .hamburger {
      display:none; flex-direction:column; gap:6px; padding:8px; cursor:pointer; transition:var(--transition);
    }
    .navbar .hamburger span { display:block; width:28px; height:2px; background:var(--text-primary); border-radius:2px; transition:var(--transition); transform-origin:center; }
    .navbar .hamburger.active span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
    .navbar .hamburger.active span:nth-child(2) { transform:translateX(-20px); opacity:0; }
    .navbar .hamburger.active span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }

    /* Footer */
    .footer { background:var(--bg-secondary); border-top:1px solid var(--border-color); padding:2rem 1.5rem; margin-top:auto; text-align:center; color:var(--text-muted); font-size:0.875rem; }

    /* 3D container */
    #three-container { width:100%; height:400px; border-radius:var(--radius); overflow:hidden; position:relative; border:1px solid var(--border-color); margin:2rem 0; }
    #three-container canvas { display:block; width:100% !important; height:100% !important; }

    /* Dock, flashlight, eye‑form, etc. – keep from previous */

    @media (max-width:768px) {
      .navbar .nav-links { display:none; width:100%; flex-direction:column; align-items:stretch; padding:1rem 0; }
      .navbar .nav-links.open { display:flex; }
      .navbar .hamburger { display:flex; }
      .grid-cols-2,.grid-cols-3,.grid-cols-4 { grid-template-columns:1fr; }
      #three-container { height:250px; }
    }
    @media (max-width:480px) { .container { padding:0 1rem; } .navbar .brand { font-size:1.2rem; } }
  </style>
</head>
<body>

  <!-- ===== PRE‑LOADER ===== -->
  <div id="preloader">
    <div class="loader-logo">Wolf<span>Society</span></div>
    <div class="loader-bar"></div>
  </div>

  <!-- ===== NAVBAR ===== -->
  <nav class="navbar" id="navbar">
    <a href="#" class="brand" data-route="/">Wolf<span>Society</span></a>
    <div class="hamburger" id="hamburgerBtn">
      <span></span><span></span><span></span>
    </div>
    <div class="nav-links" id="navLinks">
      <a href="#" data-route="/" class="active">Home</a>
      <a href="#" data-route="/teams">Teams</a>
      <a href="#" data-route="/schedule">Schedule</a>
      <a href="#" data-route="/content">Content</a>
      <a href="#" data-route="/dashboard" id="dashboardLink" style="display:none;">Dashboard</a>
      <a href="#" data-route="/login" id="loginLink">Login</a>
      <a href="#" data-route="/register" id="registerLink">Register</a>
      <a href="#" id="logoutLink" style="display:none;">Logout</a>
      <div class="toggle-3d" id="themeToggle">
        <div class="ball"></div>
      </div>
    </div>
  </nav>

  <!-- ===== APP ===== -->
  <main id="app" class="container" style="min-height:70vh; padding-top:2rem; padding-bottom:2rem;"></main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer">
    <p>&copy; 2026 Wolf Society Esports. All rights reserved.</p>
    <div class="mt-2" style="display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;">
      <span style="color:var(--text-muted);font-size:0.75rem;">🐺</span>
      <span style="color:var(--text-muted);font-size:0.75rem;">⚡</span>
      <span style="color:var(--text-muted);font-size:0.75rem;">🔥</span>
    </div>
  </footer>

  <!-- ===== TOAST ===== -->
  <div id="toastContainer" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:999;display:flex;flex-direction:column;gap:0.5rem;max-width:360px;width:100%;"></div>

  <!-- ============================================================
       JAVASCRIPT – COMPLETE APPLICATION
       ============================================================ -->
  <script>
    /**
     * ============================================================
     * WOLF SOCIETY ESPORTS – FULL SPA WITH REAL DATA
     * ============================================================
     */

    // ─── CONFIG ────────────────────────────────────────────────────
    const CONFIG = {
      API_BASE: 'https://wolf-backend.onrender.com/api', // ← CHANGE TO YOUR BACKEND URL
      APP_NAME: 'Wolf Society Esports',
      REFRESH_INTERVAL: 10000,
    };

    // ─── HELPERS ──────────────────────────────────────────────────
    const $ = (sel, ctx = document) => ctx.querySelector(sel);
    const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
    const create = (tag, attrs = {}, children = []) => {
      const el = document.createElement(tag);
      Object.entries(attrs).forEach(([k, v]) => {
        if (k === 'text') el.textContent = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'className') el.className = v;
        else el.setAttribute(k, v);
      });
      children.forEach(c => {
        if (typeof c === 'string') el.appendChild(document.createTextNode(c));
        else if (c instanceof HTMLElement) el.appendChild(c);
      });
      return el;
    };
    const append = (parent, ...children) => {
      children.forEach(c => {
        if (Array.isArray(c)) c.forEach(ch => parent.appendChild(ch));
        else if (c instanceof HTMLElement) parent.appendChild(c);
        else parent.appendChild(document.createTextNode(String(c)));
      });
      return parent;
    };
    const empty = (el) => { while (el.firstChild) el.removeChild(el.firstChild); return el; };
    const remove = (el) => el.remove();
    const on = (el, event, handler) => el.addEventListener(event, handler);

    // ─── TOAST ────────────────────────────────────────────────────
    const Toast = {
      show(message, type = 'info', duration = 4000) {
        const container = document.getElementById('toastContainer');
        const colors = { success: '#22c55e', error: '#f43f5e', info: '#0ea5e9', warning: '#f59e0b' };
        const toast = create('div', { className: `toast toast-${type}`, style: `
          padding: 0.75rem 1.25rem; border-radius: 8px; background: var(--bg-secondary);
          border-left: 4px solid ${colors[type] || colors.info}; box-shadow: var(--shadow);
          color: var(--text-primary); font-size: 0.875rem; animation: slideInRight 0.3s ease;
          border: 1px solid var(--border-color);
        `});
        const icon = { success:'✅', error:'❌', info:'ℹ️', warning:'⚠️' }[type] || 'ℹ️';
        toast.innerHTML = `<span style="margin-right:0.5rem;">${icon}</span> ${message}`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(100%)';
          setTimeout(() => remove(toast), 300);
        }, duration);
      },
      success(msg) { this.show(msg, 'success'); },
      error(msg) { this.show(msg, 'error'); },
      info(msg) { this.show(msg, 'info'); },
      warning(msg) { this.show(msg, 'warning'); }
    };

    // ─── API WRAPPER (with mock fallback) ──────────────────────
    const API = {
      auth: {
        getToken() { return localStorage.getItem('wolf_token'); },
        setToken(t) { localStorage.setItem('wolf_token', t); },
        removeToken() { localStorage.removeItem('wolf_token'); },
        getUser() { try { return JSON.parse(localStorage.getItem('wolf_user')); } catch { return null; } },
        setUser(u) { localStorage.setItem('wolf_user', JSON.stringify(u)); },
        removeUser() { localStorage.removeItem('wolf_user'); },
        isLoggedIn() { return !!this.getToken(); }
      },
      async request(method, endpoint, data = null) {
        const url = `${CONFIG.API_BASE}${endpoint}`;
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        const token = this.auth.getToken();
        if (token) options.headers['Authorization'] = `Bearer ${token}`;
        if (data) options.body = JSON.stringify(data);
        try {
          const res = await fetch(url, options);
          const result = await res.json();
          if (!res.ok) throw new Error(result.error || 'API error');
          return result;
        } catch (err) {
          console.warn('API error, using mock data:', err.message);
          return this._mock(method, endpoint, data);
        }
      },
      get(endpoint) { return this.request('GET', endpoint); },
      post(endpoint, data) { return this.request('POST', endpoint, data); },
      put(endpoint, data) { return this.request('PUT', endpoint, data); },
      delete(endpoint) { return this.request('DELETE', endpoint); },
      login(email, password) { return this.post('/auth/login', { email, password }); },
      register(email, password, full_name, role = 'player') { return this.post('/auth/register', { email, password, full_name, role }); },
      getMe() { return this.get('/auth/me'); },

      _mock(method, endpoint, data) {
        const mock = {
          '/teams': [{ id: 1, name: 'Divine Wolf', tag: 'DW', game: 'Valorant', wins: 10, losses: 3 }],
          '/players': [{ id: 1, display_name: 'KaiKishi', game: 'Valorant', role: 'Captain', status: 'active' }],
          '/matches': [{ id: 1, opponent: 'Phoenix Rising', game: 'Valorant', match_date: '2026-08-01', result: 'win' }],
          '/content': [{ id: 1, title: 'Highlight Reel', type: 'video', url: '#', description: 'Best plays' }],
          '/announcements': [{ id: 1, title: 'Welcome', content: 'New season starts soon!', published: true }],
          '/auth/login': { token: 'mock-token', user: { id: 1, email: 'admin@test.com', full_name: 'Admin', role: 'admin' } },
        };
        const key = endpoint.split('?')[0];
        const response = mock[key] || [];
        if (method === 'GET') return response;
        if (method === 'POST') return { success: true, id: Date.now() };
        if (method === 'DELETE') return { success: true };
        return { success: true };
      }
    };

    // ─── ROUTER ────────────────────────────────────────────────────
    const Router = {
      routes: [],
      current: null,

      init() {
        this.routes = [
          { path: '/', render: renderHome, guard: 'public' },
          { path: '/teams', render: renderTeams, guard: 'public' },
          { path: '/schedule', render: renderSchedule, guard: 'public' },
          { path: '/content', render: renderContent, guard: 'public' },
          { path: '/login', render: renderLogin, guard: 'public' },
          { path: '/register', render: renderRegister, guard: 'public' },
          { path: '/dashboard', render: renderDashboard, guard: 'auth' },
        ];

        window.addEventListener('popstate', () => this.handle());

        // Intercept clicks on data-route
        document.addEventListener('click', (e) => {
          const link = e.target.closest('[data-route]');
          if (!link) return;
          e.preventDefault();
          const path = link.getAttribute('data-route');
          if (path) this.navigate(path);
        });

        // Hamburger
        const hamburger = document.getElementById('hamburgerBtn');
        const navLinks = document.getElementById('navLinks');
        on(hamburger, 'click', () => {
          hamburger.classList.toggle('active');
          navLinks.classList.toggle('open');
        });

        // Logout
        document.getElementById('logoutLink').addEventListener('click', (e) => {
          e.preventDefault();
          API.auth.removeToken();
          API.auth.removeUser();
          this.navigate('/');
          Toast.success('Logged out');
          this.updateNav();
        });

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        if (themeToggle) {
          const savedTheme = localStorage.getItem('wolf_theme');
          if (savedTheme === 'dark') {
            document.body.classList.add('dark');
            themeToggle.classList.add('active');
          }
          themeToggle.addEventListener('click', () => {
            themeToggle.classList.toggle('active');
            document.body.classList.toggle('dark');
            localStorage.setItem('wolf_theme', document.body.classList.contains('dark') ? 'dark' : 'light');
          });
        }

        this.handle();
        this.updateNav();
        this.startRealtimeRefresh();
      },

      navigate(path) {
        history.pushState(null, '', path);
        this.handle();
        document.getElementById('hamburgerBtn').classList.remove('active');
        document.getElementById('navLinks').classList.remove('open');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      handle() {
        const path = window.location.pathname || '/';
        const user = API.auth.getUser();
        const role = user?.role || 'public';

        let route = this.routes.find(r => r.path === path);
        if (!route) route = this.routes.find(r => r.path === '/');

        if (route && route.guard === 'auth' && !API.auth.isLoggedIn()) {
          Toast.warning('Please log in to access this page');
          this.navigate('/login');
          return;
        }

        this.current = route;
        const app = document.getElementById('app');
        empty(app);

        if (route) {
          const content = route.render({ user, role });
          if (content instanceof HTMLElement) {
            content.classList.add('page-transition');
            app.appendChild(content);
          } else {
            app.appendChild(create('div', { html: content, className: 'page-transition' }));
          }
        } else {
          app.appendChild(create('div', { className: 'text-center py-16' }, create('h2', { text: '404 – Page not found' })));
        }
        this.updateNav();
        this.initAnimations();
        this.init3D();
      },

      updateNav() {
        const user = API.auth.getUser();
        const isLoggedIn = API.auth.isLoggedIn();
        const role = user?.role || 'public';

        document.getElementById('loginLink').style.display = isLoggedIn ? 'none' : 'inline-block';
        document.getElementById('registerLink').style.display = isLoggedIn ? 'none' : 'inline-block';
        document.getElementById('logoutLink').style.display = isLoggedIn ? 'inline-block' : 'none';
        document.getElementById('dashboardLink').style.display = (isLoggedIn && ['admin','manager','player'].includes(role)) ? 'inline-block' : 'none';

        const path = window.location.pathname || '/';
        $$('.nav-links a').forEach(a => {
          a.classList.toggle('active', a.getAttribute('data-route') === path);
        });
      },

      startRealtimeRefresh() {
        setInterval(() => {
          const path = window.location.pathname || '/';
          if (['/teams','/schedule','/content','/dashboard'].includes(path)) {
            this.handle();
          }
        }, CONFIG.REFRESH_INTERVAL);
      },

      initAnimations() {
        // Eye tracking
        initEyeTracking();
        // Flashlight
        initFlashlight();
        // Copy buttons
        initCopyButtons();
        // GSAP scroll reveals
        if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
          gsap.registerPlugin(ScrollTrigger);
          gsap.from('.feature-card', {
            opacity:0, y:40, stagger:0.15, duration:0.8, ease:'power2.out',
            scrollTrigger: { trigger:'.feature-card', start:'top 80%', toggleActions:'play none none none' }
          });
        }
      },

      init3D() {
        const container = document.getElementById('three-container');
        if (!container || container._threeInitialized) return;
        container._threeInitialized = true;
        empty(container);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 8;
        const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffffff,1);
        dirLight.position.set(5,10,7);
        scene.add(dirLight);

        const colors = [0x0ea5e9, 0xf43f5e, 0xf59e0b, 0x22c55e, 0x8b5cf6];
        const cards = [];
        for (let i=0; i<5; i++) {
          const geometry = new THREE.BoxGeometry(1.2,1.8,0.2);
          const material = new THREE.MeshStandardMaterial({
            color: colors[i % colors.length],
            roughness:0.3, metalness:0.1,
            emissive: new THREE.Color(colors[i % colors.length]).multiplyScalar(0.1)
          });
          const cube = new THREE.Mesh(geometry, material);
          const angle = (i/5) * Math.PI * 2;
          cube.position.x = Math.sin(angle) * 3.5;
          cube.position.z = Math.cos(angle) * 3.5;
          cube.userData = { angle, speed: 0.005 + i * 0.001 };
          scene.add(cube);
          cards.push(cube);
        }

        const starsGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(1000*3);
        for (let i=0; i<1000*3; i++) posArray[i] = (Math.random()-0.5)*200;
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray,3));
        const stars = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color:0xffffff, size:0.15, transparent:true, opacity:0.5 }));
        scene.add(stars);

        let animationId;
        function animate() {
          animationId = requestAnimationFrame(animate);
          cards.forEach((cube) => {
            cube.userData.angle += cube.userData.speed;
            cube.position.x = Math.sin(cube.userData.angle) * 3.5;
            cube.position.z = Math.cos(cube.userData.angle) * 3.5;
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.015;
          });
          stars.rotation.y += 0.0002;
          renderer.render(scene, camera);
        }
        animate();

        const resize = () => {
          const w = container.clientWidth, h = container.clientHeight;
          camera.aspect = w/h; camera.updateProjectionMatrix();
          renderer.setSize(w,h);
        };
        window.addEventListener('resize', resize);
        container._cleanup = () => {
          window.removeEventListener('resize', resize);
          cancelAnimationFrame(animationId);
          renderer.dispose();
        };
      }
    };

    // ─── ANIMATION HELPERS ──────────────────────────────────────
    function initEyeTracking() {
      const pupils = document.querySelectorAll('.pupil');
      if (!pupils.length) return;
      document.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        pupils.forEach(p => {
          const px = (x - 0.5) * 20;
          const py = (y - 0.5) * 20;
          p.style.transform = `translate(calc(-50% + ${px}px), calc(-50% + ${py}px))`;
        });
      });
    }
    function initFlashlight() {
      const container = document.querySelector('.flashlight-container');
      if (!container) return;
      const overlay = container.querySelector('.flashlight-overlay');
      if (!overlay) return;
      container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * 100;
        const y = ((e.clientY - rect.top) / rect.height) * 100;
        overlay.style.setProperty('--x', x + '%');
        overlay.style.setProperty('--y', y + '%');
      });
    }
    function initCopyButtons() {
      document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = btn.getAttribute('data-copy') || 'Wolf Society Esports';
          navigator.clipboard.writeText(text).then(() => {
            btn.classList.add('copied');
            btn.querySelector('.label').textContent = 'Copied!';
            setTimeout(() => {
              btn.classList.remove('copied');
              btn.querySelector('.label').textContent = 'Copy';
            }, 2000);
          }).catch(() => Toast.error('Failed to copy'));
        });
      });
    }

    // Teams

      try {
        const teams = await API.get('/teams');

        teams.forEach(team => {
          const card = create('div', { className: 'card' });
          append(card,
            create('h3', { className: 'card-title', text: team.name }),
            create('p', { className: 'card-subtitle', text: `Game: ${team.game}` }),
            create('p', { className: 'text-sm text-muted', text: `Tag: ${team.tag}` }),
            create('p', { className: 'text-sm text-muted', text: `Wins: ${team.wins} | Losses: ${team.losses}` })
          );
          grid.appendChild(card);
        });
        container.appendChild(grid);

        container.appendChild(create('p', { className: 'text-muted', text: 'Error loading teams: ' + err.message }));
      }

      return container;
    }

    // Schedule
    async function renderSchedule() {
      const container = create('div', { className: 'py-8' });
      append(container, create('h1', { className: 'text-3xl font-display font-bold mb-6', text: 'Match Schedule' }));

      try {
        const matches = await API.get('/matches');
        const table = create('div', { className: 'table-container' });
        const thead = create('thead', {},
          create('tr', {},
            ['Team','Opponent','Game','Date','Result'].map(h => create('th', { text: h }))
          )
        );
        const tbody = create('tbody');
        matches.forEach(m => {
          const tr = create('tr');
          append(tr,
            create('td', { text: m.team_name || 'TBD' }),
            create('td', { text: m.opponent }),
            create('td', { text: m.game }),
            create('td', { text: m.match_date }),
            create('td', {
              className: `text-sm ${m.result === 'win' ? 'text-success' : m.result === 'loss' ? 'text-alert' : 'text-muted'}`,
              text: m.result || 'upcoming'
            })
          );
          tbody.appendChild(tr);
        });
        table.appendChild(create('table', {}, thead, tbody));
        container.appendChild(table);
      } catch (err) {
        container.appendChild(create('p', { className: 'text-muted', text: 'Error loading matches: ' + err.message }));
      }

      try {
        const content = await API.get('/content');

        content.forEach(item => {
          const card = create('div', { className: 'card' });

            create('h3', { className: 'card-title', text: item.title }),

            create('p', { className: 'text-xs text-muted mt-2', text: `${item.type} • ${new Date(item.upload_date).toLocaleDateString()}` }),
            create('a', {
              className: 'text-teal-600 hover:underline text-sm mt-2 inline-block',

              target: '_blank',
              text: 'View Content'

          grid.appendChild(card);

        container.appendChild(grid);

        container.appendChild(create('p', { className: 'text-muted', text: 'Error loading content: ' + err.message }));

      return container;

    // Login
    function renderLogin() {
      const container = create('div', { className: 'py-8 max-w-md mx-auto' });
      append(container,
        create('h1', { className: 'text-3xl font-display font-bold text-center mb-6', text: 'Login' }),
        create('form', { className: 'card', id: 'loginForm' },
          create('div', { className: 'form-group' },
            create('label', { text: 'Email' }),
            create('input', { className: 'form-control', type: 'email', id: 'loginEmail', placeholder: 'your@email.com' })
          ),
          create('div', { className: 'form-group' },
            create('label', { text: 'Password' }),
            create('input', { className: 'form-control', type: 'password', id: 'loginPassword', placeholder: '••••••••' })
          ),
          create('button', { className: 'btn btn-primary w-full', type: 'submit', text: 'Login' })
        )
      );

      const form = container.querySelector('#loginForm');
      on(form, 'submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        try {
          const data = await API.login(email, password);
          API.auth.setToken(data.token);
          API.auth.setUser(data.user);
          Toast.success(`Welcome, ${data.user.full_name || data.user.email}`);
          Router.navigate(data.user.role === 'admin' || data.user.role === 'manager' ? '/dashboard' : '/');

          Toast.error(err.message || 'Login failed');
        }
      });

      return container;

              datasets: [{

                data: [5,8,6,10,12,9],
                backgroundColor: 'rgba(14,165,233,0.6)',
                borderColor: '#0ea5e9',
                borderWidth: 1
              }]
            },
            options: {

              },

    // ─── BOOT ──────────────────────────────────────────────────────
    window.addEventListener('load', () => {
      const preloader = document.getElementById('preloader');
      setTimeout(() => preloader.classList.add('hidden'), 2200);
    });

    document.addEventListener('DOMContentLoaded', () => {
      Router.init();
      window.__API = API;
      window.__Router = Router;
      window.addEventListener('online', () => Toast.info('Back online!'));
      window.addEventListener('offline', () => Toast.info('You are offline. Some features may not work.'));
    });
  </script>
