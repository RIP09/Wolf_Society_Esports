                </div>
              </div>
            ))}
          </div>

        </div>
      );
    }

    // --- PAGE 5: TRYOUTS & CONTACT ---
    function ContactPage() {
      const [submitted, setSubmitted] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        setSubmitted(true);
      };

      return (
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-12">
          
          <div class="text-center max-w-2xl mx-auto">
            <div class="text-redNeon font-bold text-xs uppercase tracking-widest mb-2">Join The Pack</div>
            <h1 class="font-heading text-4xl font-bold text-white uppercase mb-4">Player Tryouts & Contact</h1>
            <p class="text-gray-400 text-sm">
              Think you have what it takes to wear the Wolf Society jersey? Submit your application for Divine Wolf trial consideration or reach out for scrims and sponsorships.
            </p>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            
            {/* Form */}
            <div class="lg:col-span-7 bg-cardBg border border-borderDark p-8 rounded-xl">
              {submitted ? (
                <div class="text-center py-12 space-y-4">
                  <div class="w-16 h-16 bg-green-500/10 border border-green-500 text-green-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-check"></i>
                  </div>
                  <h3 class="font-heading text-2xl font-bold text-white">Application Received!</h3>
                  <p class="text-xs text-gray-400">Our scouting management will review your rank, win rate, and VOD links. If selected, you will be contacted via Discord.</p>
                </div>
              ) : (
                <form onSubmit={handleSubmit} class="space-y-4">
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">In-Game IGN *</label>
                      <input required type="text" placeholder="e.g. ALPHA" class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon" />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Discord Tag *</label>
                      <input required type="text" placeholder="username#0000" class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon" />
                    </div>
                  </div>

                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Primary MOBA Role *</label>
                      <select class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon">
                        <option>Jungler</option>
                        <option>Mid Lane</option>
                        <option>Gold Lane</option>
                        <option>EXP Lane</option>
                        <option>Roamer</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Current Highest Rank *</label>
                      <input required type="text" placeholder="e.g. Mythic Immortal / Challenger" class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon" />
                    </div>
                  </div>

                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Hero Pool & Tournament Experience</label>
                    <textarea rows="4" placeholder="List signature heroes and past competitive history..." class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon"></textarea>
                  </div>

                  <button type="submit" class="w-full py-3.5 bg-redNeon text-white font-bold uppercase tracking-wider text-xs rounded hover:brightness-110 transition-all glow-red">
                    Submit Scouting Application
                  </button>
                </form>
              )}
            </div>

            {/* Direct Contact Info */}
            <div class="lg:col-span-5 space-y-6">
              <div class="bg-cardBg border border-borderDark p-6 rounded-xl space-y-4">
                <h3 class="font-heading text-lg font-bold text-white uppercase">Direct Channels</h3>
                
                <div class="flex items-center gap-3 text-sm">
                  <div class="w-8 h-8 rounded bg-cyanNeon/10 text-cyanNeon flex items-center justify-center">
                    <i class="fa-solid fa-envelope"></i>
                  </div>
                  <div>
                    <div class="text-[10px] text-gray-500 uppercase">Business & Scrims</div>
                    <div class="text-white font-bold">contact@wolfsocietyesports.com</div>
                  </div>
                </div>

                <div class="flex items-center gap-3 text-sm">
                  <div class="w-8 h-8 rounded bg-purpleNeon/10 text-purpleNeon flex items-center justify-center">
                    <i class="fa-brands fa-discord"></i>
                  </div>
                  <div>
                    <div class="text-[10px] text-gray-500 uppercase">Community Discord</div>

                  </div>
                </div>

            </div>

          </div>

        </div>

    // --- MAIN APP ENTRY POINT ---
    function App() {
      const [currentPage, setCurrentPage] = useState('home');

      return (
        <div class="min-h-screen flex flex-col">
          <Navbar currentPage={currentPage} setCurrentPage={setCurrentPage} />
          
          <main class="flex-grow">
            {currentPage === 'home' && <HomePage setCurrentPage={setCurrentPage} />}
            {currentPage === 'about' && <AboutPage />}
            {currentPage === 'divine-wolf' && <DivineWolfPage />}
            {currentPage === 'matches' && <MatchesPage />}
            {currentPage === 'contact' && <ContactPage />}
          </main>

          <footer class="border-t border-borderDark bg-darkBg py-8 text-center text-xs text-gray-500">
            <div class="max-w-7xl mx-auto px-4">
              <p>Wolf Society Esports © 2026 • Dedicated to MOBA Supremacy</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
