<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wolf Society Esports | Official Portal</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#08080a', cardBg: '#10121a', borderDark: '#1c1f2e',
            cyanNeon: '#00f2fe', redNeon: '#ff2a5f', purpleNeon: '#9d4edd'
          },
          fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Chakra Petch', 'sans-serif'] }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body { background-color: #08080a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Chakra Petch', sans-serif; }
    .glow-cyan { box-shadow: 0 0 25px rgba(0, 242, 254, 0.15); }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://tdfkebgapncswtvbtaqy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZmtlYmdhcG5jc3d0dmJ0YXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTg3MzUsImV4cCI6MjA5NjMzNDczNX0.Aj-GtD5sPCtuHWmZ5ZClSStwa3-b6ENtXr0uYaV-UzQ";
    const ORG_EMAIL = "wolfsocietygg@yahoo.com";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const DEFAULT_PLAYERS = [
      { id: 1, in_game_name: "ALPHA", real_name: "Vikram Singh", role: "Jungler", signature_heroes: ["Lancelot", "Ling"], kda: "4.8", win_rate: "78%", bio: "Primary shotcaller and objective controller.", avatar_url: "https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=500&auto=format&fit=crop&q=80" },
      { id: 2, in_game_name: "SHADOW", real_name: "Rahul Sharma", role: "Mid Lane", signature_heroes: ["Kagura", "Yve"], kda: "5.2", win_rate: "74%", bio: "Tactical zone manager and teamfight burst.", avatar_url: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=500&auto=format&fit=crop&q=80" },
      { id: 3, in_game_name: "SPECTRE", real_name: "Arjun Verma", role: "Gold Lane", signature_heroes: ["Claude", "Beatrix"], kda: "6.1", win_rate: "81%", bio: "Late-game hyper-carry specialist.", avatar_url: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=500&auto=format&fit=crop&q=80" }
    ];

    const DEFAULT_MATCHES = [
      { id: 1, tournament_name: "MOBA Pro League Season 5", stage: "Grand Finals", opponent_name: "Apex Hunters", score_team: 3, score_opponent: 1, result: "WIN", match_date: "2026-07-28" },
      { id: 2, tournament_name: "Regional Masters Cup", stage: "Semi-Finals", opponent_name: "Viper Squad", score_team: 2, score_opponent: 0, result: "WIN", match_date: "2026-07-15" }
    ];

    function Navbar({ currentPage, setCurrentPage }) {
      return (
        <header class="sticky top-0 z-50 bg-darkBg/95 backdrop-blur-md border-b border-borderDark">
          <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div onClick={() => setCurrentPage('home')} class="flex items-center gap-3 cursor-pointer">
              <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyanNeon to-redNeon flex items-center justify-center text-black font-extrabold text-xl">WS</div>
              <div>
                <span class="font-heading font-bold text-xl text-white block">WOLF SOCIETY</span>
                <span class="text-[10px] uppercase tracking-widest text-cyanNeon font-semibold">Esports Portal</span>
              </div>
            </div>

            <nav class="hidden md:flex items-center gap-6 text-xs font-bold uppercase tracking-wider">
              {['home', 'about', 'divine-wolf', 'matches', 'contact'].map(page => (
                <button 
                  key={page} 
                  onClick={() => setCurrentPage(page)}
                  class={`transition-all py-1 border-b-2 ${currentPage === page ? 'text-cyanNeon border-cyanNeon' : 'text-gray-400 border-transparent hover:text-white'}`}
                >
                  {page.replace('-', ' ')}
                </button>
              ))}
            </nav>

            <a 
              href="admin.html" 
              class="px-4 py-2 rounded bg-cardBg border border-cyanNeon/40 text-cyanNeon text-xs font-bold uppercase tracking-wider hover:bg-cyanNeon hover:text-black transition-all"
            >
              <i class="fa-solid fa-lock mr-1"></i> Admin Portal
            </a>
          </div>
        </header>
      );
    }

    function HomePage({ setCurrentPage }) {
      return (
        <div class="space-y-16 pb-16">
          <section class="py-24 border-b border-borderDark bg-gradient-to-b from-darkBg via-cardBg/30 to-darkBg text-center px-4">
            <div class="inline-block px-4 py-1.5 rounded-full border border-cyanNeon/30 bg-cyanNeon/10 text-cyanNeon text-xs font-bold uppercase mb-4">
              5v5 MOBA Supremacy
            </div>
            <h1 class="font-heading text-5xl sm:text-7xl font-bold text-white uppercase mb-6">
              Wolf Society <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyanNeon to-redNeon">Esports</span>
            </h1>
            <p class="max-w-2xl mx-auto text-gray-400 text-base mb-8">
              Home of competitive MOBA title division <strong class="text-white">Divine Wolf</strong>. Built for tactical precision and championship dominance.
            </p>
            <div class="flex justify-center gap-4">
              <button onClick={() => setCurrentPage('divine-wolf')} class="px-8 py-3 rounded bg-cyanNeon text-black font-bold uppercase text-xs glow-cyan">
                View Divine Wolf Team
              </button>
              <button onClick={() => setCurrentPage('matches')} class="px-8 py-3 rounded bg-cardBg border border-borderDark text-white font-bold uppercase text-xs">
                Matches & Schedule
              </button>
            </div>
          </section>
        </div>
      );
    }

    function DivineWolfPage() {
      const [players, setPlayers] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        async function load() {
          const { data, error } = await supabaseClient.from('players').select('*').eq('is_active', true);
          setPlayers(data && data.length > 0 ? data : DEFAULT_PLAYERS);
          setLoading(false);
        }
        load();
      }, []);

      return (
        <div class="max-w-7xl mx-auto px-4 py-16 space-y-10">
          <div class="text-center max-w-2xl mx-auto">
            <span class="text-redNeon text-xs font-bold uppercase tracking-widest">Flagship Roster</span>
            <h1 class="font-heading text-4xl font-bold text-white uppercase mt-1">Divine Wolf Team</h1>
            <p class="text-gray-400 text-sm mt-2">Active starting lineup for MOBA 5v5 tournaments.</p>
          </div>

          {loading ? (
            <div class="text-center py-12 text-gray-500 font-semibold animate-pulse">Loading Roster Data...</div>
          ) : (
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              {players.map(p => (
                <div key={p.id} class="bg-cardBg border border-borderDark rounded-xl overflow-hidden hover:border-cyanNeon/50 transition-all">
                  <img src={p.avatar_url || 'https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=500'} class="w-full h-56 object-cover" />
                  <div class="p-5 space-y-3">
                    <div class="flex justify-between items-start">
                      <div>
                        <h3 class="font-heading text-2xl font-bold text-white">{p.in_game_name}</h3>
                        <div class="text-xs text-gray-400">{p.real_name}</div>
                      </div>
                      <span class="px-2.5 py-1 bg-cyanNeon/10 border border-cyanNeon/30 text-cyanNeon text-[10px] font-bold uppercase rounded">{p.role}</span>
                    </div>
                    <p class="text-xs text-gray-400">{p.bio}</p>
                    <div class="pt-2 border-t border-borderDark flex justify-between text-xs">
                      <div><span class="text-gray-500 block text-[10px]">KDA</span><strong class="text-cyanNeon">{p.kda || '4.5'}</strong></div>
                      <div><span class="text-gray-500 block text-[10px]">WIN RATE</span><strong class="text-green-400">{p.win_rate || '75%'}</strong></div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function MatchesPage() {
      const [matches, setMatches] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        async function load() {
          const { data } = await supabaseClient.from('matches').select('*').order('match_date', { ascending: false });
          setMatches(data && data.length > 0 ? data : DEFAULT_MATCHES);
          setLoading(false);
        }
        load();
      }, []);

      return (
        <div class="max-w-7xl mx-auto px-4 py-16 space-y-8">
          <div class="text-center max-w-2xl mx-auto">
            <span class="text-cyanNeon text-xs font-bold uppercase tracking-widest">Tournament Schedule</span>
            <h1 class="font-heading text-4xl font-bold text-white uppercase mt-1">Matches & Results</h1>
          </div>

          <div class="space-y-4">
            {matches.map(m => (
              <div key={m.id} class="bg-cardBg border border-borderDark p-5 rounded-xl flex flex-col md:flex-row items-center justify-between gap-4">
                <div>
                  <span class="text-xs text-gray-400">{m.tournament_name} • {m.stage}</span>
                  <div class="font-heading font-bold text-lg text-white">Divine Wolf vs {m.opponent_name}</div>
                </div>
                <div class="flex items-center gap-6">
                  <span class={`px-3 py-1 rounded text-xs font-bold border ${m.result === 'WIN' ? 'bg-green-500/10 text-green-400 border-green-500/30' : 'bg-cyanNeon/10 text-cyanNeon border-cyanNeon/30'}`}>
                    {m.result}
                  </span>
                  <div class="font-heading font-bold text-xl text-cyanNeon">{m.score_team} - {m.score_opponent}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function ContactPage() {
      const [formData, setFormData] = useState({ ign: '', email: '', discord: '', role: 'Jungler', rank: '', message: '' });
      const [submitted, setSubmitted] = useState(false);
      const [submitting, setSubmitting] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSubmitting(true);

        // Store into Supabase Database
        await supabaseClient.from('contacts').insert([formData]);

        setSubmitting(false);
        setSubmitted(true);
      };

      return (
        <div class="max-w-4xl mx-auto px-4 py-16 space-y-8">
          <div class="text-center space-y-2">
            <span class="text-redNeon text-xs font-bold uppercase tracking-widest">Join The Pack</span>
            <h1 class="font-heading text-4xl font-bold text-white uppercase">Player Tryouts & Contact</h1>
            <p class="text-xs text-gray-400">Applications are reviewed directly by org management (<strong class="text-white">{ORG_EMAIL}</strong>).</p>
          </div>

          <div class="bg-cardBg border border-borderDark p-8 rounded-xl">
            {submitted ? (
              <div class="text-center py-10 space-y-4">
                <div class="w-16 h-16 bg-green-500/10 border border-green-500 text-green-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                  <i class="fa-solid fa-paper-plane"></i>
                </div>
                <h3 class="font-heading text-2xl font-bold text-white">Application Successfully Submitted!</h3>
                <div class="bg-darkBg border border-borderDark p-4 rounded text-left max-w-lg mx-auto text-xs text-gray-300 space-y-2">
                  <p class="font-bold text-cyanNeon"><i class="fa-solid fa-robot mr-1"></i> Automatic Response Confirmation:</p>
                  <p>Thank you <strong>{formData.ign}</strong> for submitting your details. A record of your inquiry ({formData.email}) has been sent to our scouting inbox at <strong>{ORG_EMAIL}</strong>.</p>
                  <p class="text-gray-400">Our recruitment lead will review your rank and VODs, and will contact you shortly via Discord or email.</p>
                </div>
              </div>
            ) : (
              <form onSubmit={handleSubmit} class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">In-Game IGN *</label>
                    <input required type="text" value={formData.ign} onChange={e => setFormData({...formData, ign: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Your Email Address *</label>
                    <input required type="email" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon" />
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Discord Tag *</label>
                    <input required type="text" value={formData.discord} onChange={e => setFormData({...formData, discord: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Primary MOBA Role *</label>
                    <select value={formData.role} onChange={e => setFormData({...formData, role: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon">
                      {['Jungler', 'Mid Lane', 'Gold Lane', 'EXP Lane', 'Roamer'].map(r => <option key={r} value={r}>{r}</option>)}
                    </select>
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-gray-400 uppercase mb-1">Highest Peak Rank & Achievements</label>
                  <textarea rows="3" value={formData.message} onChange={e => setFormData({...formData, message: e.target.value})} class="w-full bg-darkBg border border-borderDark rounded p-3 text-sm text-white focus:outline-none focus:border-cyanNeon"></textarea>
                </div>

                <button disabled={submitting} type="submit" class="w-full py-3.5 bg-redNeon text-white font-bold uppercase text-xs rounded hover:brightness-110">
                  {submitting ? 'Submitting Application...' : 'Submit Scouting Application'}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [currentPage, setCurrentPage] = useState('home');
      return (
        <div class="min-h-screen flex flex-col">
          <Navbar currentPage={currentPage} setCurrentPage={setCurrentPage} />
          <main class="flex-grow">
            {currentPage === 'home' && <HomePage setCurrentPage={setCurrentPage} />}
            {currentPage === 'divine-wolf' && <DivineWolfPage />}
            {currentPage === 'matches' && <MatchesPage />}
            {currentPage === 'contact' && <ContactPage />}
            {currentPage === 'about' && (
              <div class="max-w-4xl mx-auto px-4 py-16 text-center space-y-4">
                <h1 class="font-heading text-4xl font-bold text-white uppercase">About Wolf Society Esports</h1>
                <p class="text-gray-400 text-sm">Founded for 5v5 MOBA excellence. Flagship squad: Divine Wolf. Contact: {ORG_EMAIL}</p>
              </div>
            )}
          </main>
          <footer class="border-t border-borderDark py-6 text-center text-xs text-gray-500">
            Wolf Society Esports © 2026 • Official Email: {ORG_EMAIL}
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
