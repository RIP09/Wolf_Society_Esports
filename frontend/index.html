<!DOCTYPE html>
<html lang="en" class="dark">
<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#0a0a0c',
            cardBg: '#12131a',
            borderDark: '#1f2230',
            cyanNeon: '#00f2fe',
            redNeon: '#ff2a5f',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase JS Client CDN -->

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #0a0a0c;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;

    }

      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
    }
    .neon-glow-red {
      box-shadow: 0 0 20px rgba(255, 42, 95, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-cyanNeon selection:text-black">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://tdfkebgapncswtvbtaqy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRkZmtlYmdhcG5jc3d0dmJ0YXF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3NTg3MzUsImV4cCI6MjA5NjMzNDczNX0.Aj-GtD5sPCtuHWmZ5ZClSStwa3-b6ENtXr0uYaV-UzQ";
    const RENDER_BACKEND_URL = "https://wolf-society-esports.onrender.com";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Fallback Mock Roster (shown if Supabase table is empty or loading)
    const MOCK_PLAYERS = [
      { id: 1, in_game_name: "ALPHA", real_name: "Vikram Singh", role: "Jungler", signature_heroes: ["Lancelot", "Hayabusa", "Ling"], avatar_url: "https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=400&auto=format&fit=crop&q=80" },
      { id: 2, in_game_name: "SHADOW", real_name: "Rahul Sharma", role: "Mid Lane", signature_heroes: ["Kagura", "Yve", "Pharsa"], avatar_url: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=400&auto=format&fit=crop&q=80" },
      { id: 3, in_game_name: "SPECTRE", real_name: "Arjun Verma", role: "Gold Lane", signature_heroes: ["Claude", "Beatrix", "Brody"], avatar_url: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=400&auto=format&fit=crop&q=80" },
      { id: 4, in_game_name: "TITAN", real_name: "Karan Patel", role: "EXP Lane", signature_heroes: ["Yu Zhong", "Chou", "Lapu-Lapu"], avatar_url: "https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=400&auto=format&fit=crop&q=80" },
      { id: 5, in_game_name: "AEGIS", real_name: "Dev Oberoi", role: "Roamer", signature_heroes: ["Khufra", "Atlas", "Lolita"], avatar_url: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=400&auto=format&fit=crop&q=80" },
    ];

    // --- NAVIGATION COMPONENT ---
    function Navbar() {
      return (
        <header class="sticky top-0 z-50 bg-darkBg/90 backdrop-blur-md border-b border-borderDark">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyanNeon to-redNeon flex items-center justify-center text-black font-bold text-xl tracking-tighter shadow-lg">
                WS
              </div>
              <div>
                <span class="font-heading font-bold text-xl tracking-wider text-white block">WOLF SOCIETY</span>
                <span class="text-[10px] uppercase tracking-widest text-cyanNeon font-semibold">MOBA Legends 5v5</span>
              </div>
            </div>

            <nav class="hidden md:flex gap-8 text-sm font-semibold tracking-wide uppercase">
              <a href="#hero" class="text-white hover:text-cyanNeon transition-colors">Home</a>
              <a href="#roster" class="text-gray-400 hover:text-cyanNeon transition-colors">Roster</a>
              <a href="#matches" class="text-gray-400 hover:text-cyanNeon transition-colors">Matches</a>
              <a href="#news" class="text-gray-400 hover:text-cyanNeon transition-colors">News</a>
            </nav>

            <div class="flex items-center gap-3">
              <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-redNeon/10 border border-redNeon/30 text-redNeon text-xs font-semibold">
                <span class="w-2 h-2 rounded-full bg-redNeon animate-pulse"></span>
                DIVINE WOLF ACTIVE
              </span>
            </div>
          </div>
        </header>
      );
    }

    // --- HERO SECTION ---
    function Hero() {
      return (
        <section id="hero" class="relative py-24 overflow-hidden border-b border-borderDark bg-gradient-to-b from-darkBg via-cardBg/50 to-darkBg">
          <div class="absolute inset-0 bg-[radial-gradient(#1f2230_1px,transparent_1px)] [background-size:24px_24px] opacity-30"></div>
          
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center">
            <div class="inline-block mb-4 px-4 py-1.5 rounded-full border border-cyanNeon/30 bg-cyanNeon/10 text-cyanNeon text-xs font-bold uppercase tracking-widest">
              MOBA Esports Organization
            </div>
            <h1 class="font-heading text-5xl sm:text-7xl font-bold tracking-tight text-white mb-6 uppercase">
              Dominating The <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyanNeon to-blue-500">5v5 Arena</span>
            </h1>
            <p class="max-w-2xl mx-auto text-gray-400 text-lg mb-8">
              Official home of <strong class="text-white">Divine Wolf</strong> — Wolf Society's flagship professional MOBA team engineered for tactical supremacy and competitive dominance.
            </p>
            <div class="flex flex-wrap justify-center gap-4">
              <a href="#roster" class="px-8 py-3.5 rounded-md bg-gradient-to-r from-cyanNeon to-blue-600 text-black font-bold uppercase tracking-wider text-sm hover:brightness-110 transition-all neon-glow-cyan">
                Meet Divine Wolf
              </a>
              <a href="#matches" class="px-8 py-3.5 rounded-md bg-cardBg border border-borderDark text-white font-bold uppercase tracking-wider text-sm hover:border-cyanNeon/50 transition-all">
                Match Schedule
              </a>
            </div>
          </div>
        </section>
      );
    }

    // --- PLAYERS ROSTER SECTION (Dynamic Supabase Integration) ---
    function Roster() {
      const [players, setPlayers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [isLiveDatabase, setIsLiveDatabase] = useState(false);

      useEffect(() => {
        async function fetchRoster() {
          try {
            // Query Supabase 'players' table
            const { data, error } = await supabaseClient
              .from('players')
              .select('*')
              .eq('team_name', 'Divine Wolf')
              .order('created_at', { ascending: true });

            if (error) throw error;

            if (data && data.length > 0) {
              setPlayers(data);
              setIsLiveDatabase(true);
            } else {
              // Fallback to mock data if empty
              setPlayers(MOCK_PLAYERS);
            }
          } catch (err) {
            console.warn("Could not fetch from Supabase table or table is empty yet. Using default mock roster:", err.message);
            setPlayers(MOCK_PLAYERS);
          } finally {
            setLoading(false);
          }
        }

        fetchRoster();
      }, []);

      return (
        <section id="roster" class="py-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex flex-col md:flex-row md:items-end justify-between mb-12">
            <div>
              <div class="text-cyanNeon font-bold text-xs uppercase tracking-widest mb-1">Active Roster</div>
              <h2 class="font-heading text-4xl font-bold text-white uppercase">Divine Wolf Roster</h2>
            </div>
            <div class="mt-4 md:mt-0 text-xs text-gray-500 flex items-center gap-2">
              <span class={`w-2 h-2 rounded-full ${isLiveDatabase ? 'bg-green-500' : 'bg-amber-500'}`}></span>
              {isLiveDatabase ? 'Connected to Supabase Live DB' : 'Showing Default Template Roster'}
            </div>
          </div>

          {loading ? (
            <div class="text-center py-16 text-gray-500 font-semibold animate-pulse">
              Loading Divine Wolf Warriors...
            </div>
          ) : (
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {players.map((player) => (
                <div 
                  key={player.id} 
                  class="group bg-cardBg border border-borderDark hover:border-cyanNeon/50 rounded-xl overflow-hidden transition-all duration-300 hover:-translate-y-1 neon-glow-cyan"
                >
                  <div class="relative h-64 bg-slate-900 overflow-hidden">
                    <img 
                      src={player.avatar_url || "https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=400&auto=format&fit=crop&q=80"} 
                      alt={player.in_game_name}
                      class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500" 
                    />
                    <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-transparent"></div>
                    
                    <div class="absolute top-3 right-3 bg-darkBg/80 backdrop-blur-md border border-cyanNeon/30 text-cyanNeon text-[11px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">
                      {player.role}
                    </div>
                  </div>

                  <div class="p-6">
                    <h3 class="font-heading text-2xl font-bold text-white group-hover:text-cyanNeon transition-colors tracking-wide">
                      {player.in_game_name}
                    </h3>
                    <p class="text-xs text-gray-400 mb-4">{player.real_name || "Professional Athlete"}</p>

                    <div>
                      <div class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold mb-2">Signature Heroes</div>
                      <div class="flex flex-wrap gap-1.5">
                        {player.signature_heroes && player.signature_heroes.map((hero, idx) => (
                          <span key={idx} class="text-[11px] bg-darkBg border border-borderDark px-2 py-0.5 rounded text-gray-300">
                            {hero}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </section>
      );
    }

    // --- MATCHES & NEWS SECTION ---
    function MatchesAndNews() {
      return (
        <div class="bg-cardBg/30 border-t border-borderDark py-20">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 grid grid-cols-1 lg:grid-cols-2 gap-12">
            
            {/* Matches Column */}
            <div id="matches">
              <div class="text-cyanNeon font-bold text-xs uppercase tracking-widest mb-1">Tournament Track</div>
              <h2 class="font-heading text-3xl font-bold text-white uppercase mb-6">Recent Matches</h2>

              <div class="space-y-4">
                <div class="bg-cardBg border border-borderDark p-4 rounded-xl flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <span class="px-2.5 py-1 rounded bg-green-500/10 text-green-400 border border-green-500/20 font-bold text-xs">WIN</span>
                    <div>
                      <div class="font-heading font-bold text-white">Divine Wolf vs Nexus Gaming</div>
                      <div class="text-xs text-gray-400">MOBA Championship Season 4</div>
                    </div>
                  </div>
                  <div class="font-heading font-bold text-lg text-cyanNeon">2 - 0</div>
                </div>

                <div class="bg-cardBg border border-borderDark p-4 rounded-xl flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    <span class="px-2.5 py-1 rounded bg-green-500/10 text-green-400 border border-green-500/20 font-bold text-xs">WIN</span>
                    <div>
                      <div class="font-heading font-bold text-white">Divine Wolf vs Titan Esports</div>
                      <div class="text-xs text-gray-400">Regional MOBA Qualifier</div>
                    </div>
                  </div>
                  <div class="font-heading font-bold text-lg text-cyanNeon">2 - 1</div>
                </div>
              </div>
            </div>

            {/* News Column */}
            <div id="news">
              <div class="text-redNeon font-bold text-xs uppercase tracking-widest mb-1">Announcements</div>
              <h2 class="font-heading text-3xl font-bold text-white uppercase mb-6">Latest Headlines</h2>

              <div class="space-y-4">
                <article class="bg-cardBg border border-borderDark p-5 rounded-xl hover:border-redNeon/40 transition-colors">
                  <span class="text-[10px] text-redNeon font-semibold tracking-widest uppercase">Official Announcement</span>
                  <h3 class="font-heading font-bold text-white text-lg mt-1 mb-2">Divine Wolf Qualifies for Grand Finals</h3>
                  <p class="text-xs text-gray-400">The 5v5 MOBA squad secures an undefeated streak through the upper bracket rounds.</p>
                </article>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // --- FOOTER COMPONENT ---
    function Footer() {
      return (
        <footer class="mt-auto border-t border-borderDark bg-darkBg py-10">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <p class="text-sm font-semibold text-white">Wolf Society Esports © 2026</p>
              <p class="text-xs text-gray-500 mt-0.5">Dedicated to MOBA Legends 5v5 | Flagship Team: Divine Wolf</p>
            </div>
            <div class="flex items-center gap-4 text-xs text-gray-400">
              <span>Backend API: <code class="text-cyanNeon">wolf-society-esports.onrender.com</code></span>
            </div>
          </div>
        </footer>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      return (
        <div class="min-h-screen flex flex-col">
          <Navbar />
          <main class="flex-grow">
            <Hero />
            <Roster />
            <MatchesAndNews />
          </main>
          <Footer />
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
