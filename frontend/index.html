<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wolf Society Esports</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - new interesting set -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Reset & Base ── */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #0a0a0c;
        font-family: 'Exo 2', sans-serif;
        color: #e0e0e0;
      }
      .font-display {
        font-family: 'Russo One', sans-serif;
      }
      .font-tech {
        font-family: 'Orbitron', monospace;
      }

      /* ── Neon Glows ── */
      .glow-blue {
        box-shadow: 0 0 20px rgba(0, 150, 255, 0.3), 0 0 60px rgba(0, 150, 255, 0.1);
      }
      .glow-green {
        box-shadow: 0 0 20px rgba(0, 255, 150, 0.3), 0 0 60px rgba(0, 255, 150, 0.1);
      }
      .glow-pink {
        box-shadow: 0 0 20px rgba(255, 0, 150, 0.3), 0 0 60px rgba(255, 0, 150, 0.1);
      }
      .neon-border-blue {
        border: 1px solid rgba(0, 150, 255, 0.5);
        box-shadow: 0 0 15px rgba(0, 150, 255, 0.15);
      }
      .neon-border-green {
        border: 1px solid rgba(0, 255, 150, 0.5);
        box-shadow: 0 0 15px rgba(0, 255, 150, 0.15);
      }
      .neon-border-pink {
        border: 1px solid rgba(255, 0, 150, 0.5);
        box-shadow: 0 0 15px rgba(255, 0, 150, 0.15);
      }

      /* ── Hover Animations ── */
      .card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .card-hover:hover {
        transform: translateY(-6px) scale(1.01);
      }
      .hover-glow-blue:hover {
        box-shadow: 0 0 30px rgba(0, 150, 255, 0.5), 0 0 80px rgba(0, 150, 255, 0.2);
        border-color: rgba(0, 150, 255, 0.8);
        transform: scale(1.02);
        transition: all 0.3s ease;
      }
      .hover-glow-green:hover {
        box-shadow: 0 0 30px rgba(0, 255, 150, 0.5), 0 0 80px rgba(0, 255, 150, 0.2);
        border-color: rgba(0, 255, 150, 0.8);
        transform: scale(1.02);
        transition: all 0.3s ease;
      }
      .hover-glow-pink:hover {
        box-shadow: 0 0 30px rgba(255, 0, 150, 0.5), 0 0 80px rgba(255, 0, 150, 0.2);
        border-color: rgba(255, 0, 150, 0.8);
        transform: scale(1.02);
        transition: all 0.3s ease;
      }

      .bg-charcoal {
        background: #0a0a0c;
      }
      .bg-card {
        background: #14141a;
      }
      .bg-card-light {
        background: #1a1a24;
      }
      .text-neon-blue {
        color: #0096ff;
      }
      .text-neon-green {
        color: #00ff96;
      }
      .text-neon-pink {
        color: #ff0096;
      }
      .border-neon-blue {
        border-color: rgba(0, 150, 255, 0.4);
      }
      .border-neon-green {
        border-color: rgba(0, 255, 150, 0.4);
      }
      .border-neon-pink {
        border-color: rgba(255, 0, 150, 0.4);
      }
      .gradient-text {
        background: linear-gradient(135deg, #0096ff, #00ff96);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .gradient-text-pink {
        background: linear-gradient(135deg, #ff0096, #ff6600);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      /* ── Match Cards ── */
      .match-card {
        background: linear-gradient(145deg, #14141a, #0e0e12);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .match-card.live {
        border-color: rgba(255, 0, 0, 0.6);
        animation: pulse-border 1.5s ease-in-out infinite;
      }
      @keyframes pulse-border {
        0%,
        100% {
          box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }
        50% {
          box-shadow: 0 0 30px rgba(255, 0, 0, 0.5), 0 0 60px rgba(255, 0, 0, 0.1);
        }
      }
      .live-dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        background: #ff0000;
        border-radius: 50%;
        animation: blink 1s ease-in-out infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0c;
      }
      ::-webkit-scrollbar-thumb {
        background: #0096ff;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #00ff96;
      }

      /* ── Nav Link Underline ── */
      .nav-link {
        position: relative;
        transition: color 0.3s ease;
      }
      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(90deg, #0096ff, #00ff96);
        transition: width 0.3s ease;
      }
      .nav-link:hover::after {
        width: 100%;
      }
      .nav-link:hover {
        color: #fff;
      }

      /* ── Loading Fallback ── */
      #root-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Orbitron', monospace;
        font-size: 1.5rem;
        color: #0096ff;
        background: #0a0a0c;
        gap: 0.75rem;
      }
      #root-loading .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(0, 150, 255, 0.15);
        border-top: 4px solid #0096ff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>

    <!-- ─── CDN SCRIPTS ──────────────────────────────────────────────── -->

      const MATCHES = [

      // ──────────────────────────────────────────────────────────────────────
      // 2. CUSTOM ROUTER
      // ──────────────────────────────────────────────────────────────────────
      const RouterContext = React.createContext();

      const Router = ({ children }) => {
        const [currentPath, setCurrentPath] = useState(window.location.pathname);

        useEffect(() => {
          const onPopState = () => {
            setCurrentPath(window.location.pathname);
          };
          window.addEventListener('popstate', onPopState);
          return () => window.removeEventListener('popstate', onPopState);
        }, []);

        const navigate = (to) => {
          window.history.pushState(null, '', to);
          setCurrentPath(to);
        };

        return (
          <RouterContext.Provider value={{ currentPath, navigate }}>
            {children}
          </RouterContext.Provider>
        );
      };

      const useRouter = () => React.useContext(RouterContext);

      const Link = ({ to, children, className, onClick }) => {
        const { navigate } = useRouter();
        const handleClick = (e) => {
          e.preventDefault();
          if (onClick) onClick(e);
          navigate(to);
        };
        return (
          <a href={to} onClick={handleClick} className={className}>
            {children}
          </a>
        );
      };

      const Route = ({ path, component: Component }) => {
        const { currentPath } = useRouter();
        if (currentPath === path) {
          return <Component />;
        }
        return null;
      };

      // ──────────────────────────────────────────────────────────────────────
      // 3. SHARED COMPONENTS
      // ──────────────────────────────────────────────────────────────────────

      // ── Navbar ──

        return (

              <Link

              {/* Desktop Nav */}

              {/* Mobile Toggle */}

              >
                <svg
                  className="w-6 h-6"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  {isOpen ? (

                      strokeLinecap="round"
                      strokeLinejoin="round"
                      strokeWidth={2}
                      d="M6 18L18 6M6 6l12 12"
                    />

                      strokeLinejoin="round"

            {/* Mobile Nav */}

              <div className="md:hidden py-4 border-t border-white/5 flex flex-col gap-3 text-sm uppercase tracking-wider">
                {links.map((link) => (

                    key={link.to}

                    onClick={() => setIsOpen(false)}

                  className="px-4 py-1.5 rounded-full bg-gradient-to-r from-blue-600 to-green-500 text-white text-xs font-bold uppercase tracking-wider hover:scale-105 transition-transform inline-block w-fit font-tech"

      };

      // ── Footer ──
      const Footer = () => (
        <footer className="bg-[#0a0a0c] border-t border-white/5 py-12 px-4 mt-12">
          <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8">
            <div>
              <div className="font-display text-xl font-bold mb-4">

              <p className="text-gray-500 text-sm leading-relaxed">

      // ── Match Card ──
      const MatchCard = ({ match, detailed = false }) => {
        const isLive = match.status === 'live';
        const isUpcoming = match.status === 'upcoming';
        const isFinished = match.status === 'finished';

        let statusColor = 'text-gray-500';
        let statusBadge = 'Upcoming';
        let borderClass = 'border-white/5';
        if (isLive) {
          statusColor = 'text-red-400';
          statusBadge = '🔴 LIVE';
          borderClass = 'border-red-600/30';
        } else if (isUpcoming) {
          statusColor = 'text-neon-blue';
          statusBadge = `⏱️ ${match.time}`;
        } else {
          statusColor = 'text-gray-400';
          statusBadge = '✓ Finished';

        return (
          <div

            <div className="flex items-center justify-between mb-3">
              <span className="text-xs text-gray-500 uppercase tracking-wider font-tech">

              </span>
              <span className={`text-xs font-bold ${statusColor} font-tech`}>

              </span>
            </div>
            <div className="flex items-center justify-between gap-4">
              <div className="flex-1 text-center">
                <p className="text-white font-bold text-lg font-display">{match.team1}</p>

            <div className="mt-3 flex items-center justify-between text-xs text-gray-500 border-t border-white/5 pt-3">

      // ── News Card ──

                            <p className="text-white font-medium text-sm font-display">
                              {n.title}
                            </p>
                            <p className="text-xs text-gray-500 font-tech">
                              {n.date} • {n.category}
                            </p>
                          </div>
                        </div>
                        <div className="flex gap-2">
                          <button className="text-xs text-gray-500 hover:text-white transition-colors font-tech">
                            ✏️
                          </button>
                          <button className="text-xs text-gray-500 hover:text-red-500 transition-colors font-tech">
                            🗑️
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {activeTab === 'sponsors' && (
                <div>
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-white font-bold text-lg font-display">Sponsors</h3>
                    <button className="px-4 py-1.5 rounded-lg bg-blue-600/20 text-blue-400 text-xs font-bold border border-blue-600/30 hover:bg-blue-600/30 transition-colors font-tech">
                      + Add Sponsor
                    </button>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                    {SPONSORS.map((s, i) => (
                      <div
                        key={i}
                        className="bg-[#0e0e12] p-4 rounded-lg border border-white/5 text-center"
                      >
                        <span className="text-3xl block mb-1">{s.logo}</span>
                        <p className="text-white text-sm font-medium font-display">{s.name}</p>
                        <button className="mt-2 text-xs text-gray-500 hover:text-red-500 transition-colors font-tech">
                          Remove
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* Quick Stats */}
            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
              <div className="bg-[#14141a] p-4 rounded-xl border border-white/5 text-center">
                <p className="text-2xl font-bold text-neon-blue font-tech">3</p>
                <p className="text-xs text-gray-500 font-tech">Active Teams</p>
              </div>
              <div className="bg-[#14141a] p-4 rounded-xl border border-white/5 text-center">
                <p className="text-2xl font-bold text-neon-green font-tech">14</p>
                <p className="text-xs text-gray-500 font-tech">Total Players</p>
              </div>
              <div className="bg-[#14141a] p-4 rounded-xl border border-white/5 text-center">
                <p className="text-2xl font-bold text-neon-pink font-tech">4</p>
                <p className="text-xs text-gray-500 font-tech">Upcoming Matches</p>
              </div>
              <div className="bg-[#14141a] p-4 rounded-xl border border-white/5 text-center">
                <p className="text-2xl font-bold text-white font-tech">6</p>
                <p className="text-xs text-gray-500 font-tech">Sponsors</p>
              </div>
            </div>
          </div>
        );
      };

      // ──────────────────────────────────────────────────────────────────────
      // 5. APP
      // ──────────────────────────────────────────────────────────────────────
      const App = () => (
        <Router>
          <Navbar />
          <Route path="/" component={Home} />
          <Route path="/about" component={About} />
          <Route path="/teams" component={Teams} />
          <Route path="/matches" component={Matches} />
          <Route path="/news" component={NewsPage} />
          <Route path="/stream" component={Stream} />
          <Route path="/contact" component={Contact} />
          <Route path="/admin" component={Admin} />
          <Footer />
        </Router>
      );

      // ──────────────────────────────────────────────────────────────────────
      // 6. MOUNT
      // ──────────────────────────────────────────────────────────────────────
      const rootElement = document.getElementById('root');
      const loadingElement = document.getElementById('root-loading');

      if (rootElement) {
        if (loadingElement) loadingElement.style.display = 'none';
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    </script>
  </body>
</html>
